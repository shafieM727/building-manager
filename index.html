function normalizeWhatsAppPhone(raw){
  let p=String(raw||"").trim().replace(/[\s().-]/g,"");
  if(!p) return null;
  if(p.startsWith("00")) p=p.slice(2);
  if(p.startsWith("+")) p=p.slice(1);
  // Egypt local mobile: 01012345678 -> 201012345678 (نشيل الصفر الأول ونحط كود الدولة)
  if(p.startsWith("01") && p.length===11) p="20"+p.slice(1);
  return /^\d{8,15}$/.test(p) ? p : null;
}
function whatsappUrl(phone,text){
  const normalized=normalizeWhatsAppPhone(phone);
  return normalized ? "https://wa.me/"+normalized+"?text="+encodeURIComponent(text) : null;
}

  let phone=normalizeWhatsAppPhone(v.apartments?.phone);
  if(!phone) return alert("رقم WhatsApp غير صحيح. استخدم مثل 01012345678 أو +201012345678");
  let t=`🏢 برج الرسالة\nالشقة: ${v.apartments.apartment_number}\nالمخالفة: ${v.violation_type}\nالقيمة: ${money(v.amount)}\nموعد التحصيل: ${date(v.due_date)}\nبرجاء التكرم بالسداد.`;
  window.open(whatsappUrl(phone,t),"_blank");
}

async function requestsPage(){$("main").innerHTML='<div class="empty">⏳ جاري التحميل...</div>';let isAdmin=me.role==='admin',isResident=me.role==='resident';let q=db.from('maintenance_requests').select('*,apartments(apartment_number,resident_name),maintenance_contacts(name,role,phone)').order('created_at',{ascending:false});if(isResident)q=q.eq('apartment_id',me.apartment_id);let r=await q,list=r.data||[];let contacts=isAdmin?(await db.from('maintenance_contacts').select('*')).data||[]:[];window.__maintenanceContacts=contacts;$('main').innerHTML=head('طلبات الصيانة',isResident?'طلباتك الخاصة بشقتك':'كل طلبات الصيانة في البرج',isResident?`<button class="primary" onclick="requestModal()">+ طلب صيانة جديد</button>`:'')+(list.map(x=>`<div class="card"><div class="between"><b>${esc(x.title)}</b>${requestStatusBadge(x.status)}</div>${!isResident?`<p>شقة ${esc(x.apartments?.apartment_number)} - ${esc(x.apartments?.resident_name||'')}</p>`:''}${x.description?`<small>${esc(x.description)}</small>`:''}<small class="muted">${date(x.created_at)}${x.maintenance_contacts?' • تم التحويل لـ '+esc(x.maintenance_contacts.name):''}</small>${isAdmin?`<div class="actions"><select onchange="updateRequestStatus('${x.id}',this.value)"><option value="open" ${x.status==='open'?'selected':''}>مفتوح</option><option value="in_progress" ${x.status==='in_progress'?'selected':''}>جاري التنفيذ</option><option value="resolved" ${x.status==='resolved'?'selected':''}>تم الحل</option><option value="cancelled" ${x.status==='cancelled'?'selected':''}>ملغي</option></select><select onchange="assignRequestContact('${x.id}',this.value)"><option value="">تحويل لفني...</option>${contacts.map(c=>`<option value="${c.id}" ${x.assigned_contact_id===c.id?'selected':''}>${esc(c.name)} (${esc(c.role)})</option>`).join('')}</select>${x.maintenance_contacts?.phone?`<button onclick="waContact('${esc(x.maintenance_contacts.phone)}','${esc(x.maintenance_contacts.name)}')">💬 إبلاغ الفني</button>`:''}</div>`:''}</div>`).joi async function mySenderLabel(){if(window.__senderLabel)return window.__senderLabel;let label;if(me.role==='admin')label='👑 الإدارة';else if(me.role==='viewer')label='👁️ مشاهد';else{let a=me.apartment_id?(await db.from('apartments').select('apartment_number').eq('id',me.apartment_id).maybeSingle()).data:null;label=a?'شقة '+a.apartment_number:(me.full_name||me.username)}window.__senderLabel=label;return label}

function debounceGlobalSearch(){clearTimeout(window.__gsTimer);window.__gsTimer=setTimeout(runGlobalSearch,300)}
async function runGlobalSearch(){
  let raw=$('gsq')?.value.trim(),box=$('gsResults');
  if(!box)return;
  if(!raw||raw.length<2){box.innerHTML='<div class="empty">اكتب حرفين على الأقل</div>';return}
  box.innerHTML='<div class="empty">⏳ جاري البحث...</div>';
  let q=raw.replace(/[%,]/g,''),isAdmin=me.role==='admin',isViewer=me.role==='viewer',results=[];
  let aptsR=await db.from('apartments').select('*').or(`apartment_number.ilike.%${q}%,resident_name.ilike.%${q}%,phone.ilike.%${q}%,owner_name.ilike.%${q}%,owner_phone.ilike.%${q}%`).limit(8);
  (aptsR.data||[]).forEach(a=>results.push({icon:'🏢',title:`شقة ${a.apartment_number}`,sub:a.resident_name||'بدون ساكن',action:`apartmentDetails('${a.id}')`}));
  if(isAdmin||isViewer){
    let vR=await db.from('violations').select('*,apartments(apartment_number)').ilike('violation_type',`%${q}%`).limit(8);
    (vR.data||[]).forEach(v=>results.push({icon:'⚠️',title:v.violation_type,sub:`شقة ${v.apartments?.apartment_number||''} - ${money(v.amount)}`,action:`apartmentDetails('${v.apartment_id}')`}));
  }
  let cR=await db.from('maintenance_contacts').select('*').or(`name.ilike.%${q}%,role.ilike.%${q}%`).limit(6);
  (cR.data||[]).forEach(c=>results.push({icon:'🛠️',title:c.name,sub:c.role,action:`maintenancePage()`}));
  if(isAdmin){
    let uR=await db.from('profiles').select('*').or(`username.ilike.%${q}%,full_name.ilike.%${q}%`).limit(6);
    (uR.data||[]).forEach(u=>results.push({icon:'👤',title:u.full_name||u.username,sub:u.username,action:`usersPage()`}));
  }
  if(!results.length){box.innerHTML='<div class="empty">لا توجد نتائج</div>';return}

function bulkReminderModal(){openModal('إرسال تنبيه جماعي',`<label class="label">المستلمين</label><select id="brAudience"><option value="all">كل الشقق</option><option value="late_charges">الشقق المتأخرة عن الاشتراك الشهري</option><option value="open_violations">الشقق عليها مخالفات مستحقة</option></select><label class="label">نص الرسالة</label><textarea id="brMsg" rows="5" placeholder="اكتب رسالتك هنا..."></textarea><label class="label"><input id="brDetails" type="checkbox" checked style="width:auto;display:inline-block"> أضف تفاصيل المبلغ المستحق تلقائيًا لكل شقة</label><div class="buttons"><button class="primary" onclick="prepareBulkReminder()">التالي</button><button onclick="closeModal()">إلغاء</button></div>`)}
async function prepareBulkReminder(){
  let audience=$('brAudience').value,baseMsg=$('brMsg').value.trim(),withDetails=$('brDetails').checked;
  if(!baseMsg)return alert('اكتب نص الرسالة');
  let apts=[];
  if(audience==='all'){
    apts=((await db.from('apartments').select('*').eq('is_active',true).order('apartment_number')).data||[]).map(a=>({...a,detail:null}));
  }else if(audience==='late_charges'){
    let r=await db.from('monthly_charges').select('*,apartments(*)').neq('status','paid'),byApt={};
    (r.data||[]).forEach(c=>{if(!c.apartments)return;let id=c.apartment_id;if(!byApt[id])byApt[id]={...c.apartments,due:0,months:[]};let remaining=(+c.amount||0)-(+c.paid_amount||0);byApt[id].due+=remaining;byApt[id].months.push(c.period_month)});
    apts=Object.values(byApt).map(a=>({...a,detail:`المستحق عليك: ${money(a.due)} (${a.months.join('، ')})`}));
  }else if(audience==='open_violations'){
    let r=await db.from('violations').select('*,apartments(*)').in('status',['unpaid','overdue']),byApt={};
    (r.data||[]).forEach(v=>{if(!v.apartments)return;let id=v.apartment_id;if(!byApt[id])byApt[id]={...v.apartments,due:0,items:[]};byApt[id].due+=(+v.amount||0);byApt[id].items.push(v.violation_type)});
    apts=Object.values(byApt).map(a=>({...a,detail:`مخالفات مستحقة: ${money(a.due)} (${a.items.join('، ')})`}));
  }
  apts=apts.filter(a=>normalizeWhatsAppPhone(a.phone));
  if(!apts.length)return alert('لا توجد شقق مطابقة بأرقام واتساب صحيحة');
  window.__bulkTargets=apts;window.__bulkReminderData={baseMsg,withDetails};
  openModal(`إرسال لـ ${apts.length} شقة`,`<div class="notice">دوس على كل زرار على حدة (المتصفح بيمنع فتح أكتر من تاب واتساب تلقائيًا).</div>`+apts.map((a,i)=>`<div class="row"><span>شقة ${esc(a.apartment_number)}<small>${esc(a.resident_name||'')}${a.detail?' • '+esc(a.detail):''}</small></span><button onclick="sendBulkReminderTo(${i})">💬 إرسال</button></div>`).join(''));
}
function sendBulkReminderTo(i){let a=window.__bulkTargets?.[i],d=window.__bulkReminderData;if(!a||!d)return;let p=normalizeWhatsAppPhone(a.phone);if(!p)return alert('رقم غير صحيح');let msg=d.baseMsg+(d.withDetails&&a.detail?'\n\n'+a.detail:'');window.open(whatsappUrl(p,msg),'_blank')}

function urlBase64ToUint8Array(base64String){let padding="=".repeat((4-base64String.length%4)%4),base64=(base64String+padding).replace(/-/g,"+").replace(/_/g,"/"),rawData=atob(base64),outputArray=new Uint8Array(rawData.length);for(let i=0;i<rawData.length;i++)outputArray[i]=rawData.charCodeAt(i);return outputArray}
async function enablePushNotifications(){
  if(!("serviceWorker" in navigator)||!("PushManager" in window))return alert("المتصفح/التطبيق ده مش بيدعم الإشعارات");
  try{
    let reg=await navigator.serviceWorker.ready;
    let existing=await reg.pushManager.getSubscription();
    if(existing){alert("✅ الإشعارات مفعّلة بالفعل على الجهاز ده");return}
    let perm=await Notification.requestPermission();
    if(perm!=="granted")return alert("محتاجين إذنك لتفعيل الإشعارات من إعدادات الجهاز/المتصفح");
    let sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)});
    let j=sub.toJSON();
    let r=await db.from('push_subscriptions').upsert({user_id:session.user.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth_key:j.keys.auth},{onConflict:'endpoint'});
    if(r.error)return alert(friendlyError(r.error.message));
    alert("🔔 تم تفعيل الإشعارات على الجهاز ده بنجاح");
  }catch(e){alert("تعذر تفعيل الإشعارات: "+(e?.message||e))}
}
