function normalizeWhatsAppPhone(raw){
  let p=String(raw||"").trim().replace(/[\s().-]/g,"");
  if(!p) return null;
  if(p.startsWith("00")) p=p.slice(2);
  if(p.startsWith("+")) p=p.slice(1);
  // Egypt local mobile: 01012345678 -> 201012345678
  if(p.startsWith("01") && p.length===11) p="20"+p;
  return /^\d{8,15}$/.test(p) ? p : null;
}
function whatsappUrl(phone,text){
  const normalized=normalizeWhatsAppPhone(phone);
  return normalized ? "https://wa.me/"+normalized+"?text="+encodeURIComponent(text) : null;
}

async function saveP(){let apId=$("pa").value;if(!apId)return alert("اختر الشقة");let amount=+$("pm").value||0;if(amount<=0)return alert('أدخل مبلغًا صحيحًا');let chargeId=$("pc").value||null;let r=await db.from("payments").insert({apartment_id:apId,monthly_charge_id:chargeId,amount,payment_method:$("pt").value,notes:$("pn").value,created_by:session.user.id,payment_date:today()});if(r.error)return alert(friendlyError(r.error.message));if(chargeId){let c=(await db.from('monthly_charges').select('*').eq('id',chargeId).single()).data;if(c){let paid=Math.min(+c.amount,+c.paid_amount+amount),status=paid>=+c.amount?'paid':paid>0?'partial':'unpaid';await db.from('monthly_charges').update({paid_amount:paid,status}).eq('id',chargeId)}}closeModal();paymentsPage()}
async function expensesPage(cat){let canEdit=me.role!=='viewer',r=await db.from("expenses").select("*").order("expense_date",{ascending:false});let all=r.data||[];let byCat={};all.forEach(x=>{let k=x.category||'بدون تصنيف';byCat[k]=(byCat[k]||0)+(+x.amount||0)});let list=cat?all.filter(x=>(x.category||'بدون تصنيف')===cat):all;$('main').innerHTML=head("المصروفات",`إجمالي ${money(all.reduce((s,x)=>s+(+x.amount||0),0))}`,canEdit?`<button class="primary" onclick="eModal()">+ مصروف</button>`:'')+`<div class="chips">${cat?`<button class="chip" onclick="expensesPage()">✕ الكل</button>`:''}${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<button class="chip ${cat===k?'active':''}" onclick="expensesPage('${esc(k)}')">${esc(k)} • ${money(v)}</button>`).join('')}</div>`+(list.map(x=>`<div class="card"><div class="between"><span>${esc(x.title)}${x.category?` <span class="badge blue">${esc(x.category)}</span>`:''}<small>${date(x.expense_date)}${x.vendor?' • '+esc(x.vendor):''}${x.notes?' • '+esc(x.notes):''}</small></span><b>${money(x.amount)}</b></div>${canEdit?`<div class="actions"><button onclick="editExpense('${x.id}')">✏️</button></div>`:''}</div>`).join("")||'<div class="empty">لا توجد مصروفات</div>')}
function eModal(x={}){openModal(x.id?'تعديل مصروف':'إضافة مصروف',`<input id="et" value="${esc(x.title||'')}" placeholder="بيان المصروف"><input id="em" type="number" value="${x.amount||0}" placeholder="القيمة"><input id="ed" type="date" value="${x.expense_date||today()}"><select id="ecat"><option value="">بدون تصنيف</option><option value="صيانة" ${x.category==='صيانة'?'selected':''}>صيانة</option><option value="نظافة" ${x.category==='نظافة'?'selected':''}>نظافة</option><option value="أمن وحراسة" ${x.category==='أمن وحراسة'?'selected':''}>أمن وحراسة</option><option value="كهرباء ومياه" ${x.category==='كهرباء ومياه'?'selected':''}>كهرباء ومياه</option><option value="أسانسير" ${x.category==='أسانسير'?'selected':''}>أسانسير</option><option value="إدارية" ${x.category==='إدارية'?'selected':''}>إدارية</option><option value="أخرى" ${x.category==='أخرى'?'selected':''}>أخرى</option></select><input id="evd" value="${esc(x.vendor||'')}" placeholder="المورّد / الجهة (اختياري)"><textarea id="en" placeholder="ملاحظات">${esc(x.notes||'')}</textarea><div class="buttons"><button class="primary" onclick="saveE('${x.id||''}')">حفظ</button><button onclick="closeModal()">إلغاء</button></div>`)}
async function saveE(id){let p={title:$("et").value,amount:+$("em").value||0,expense_date:$("ed").value||today(),category:$("ecat").value||null,vendor:$("evd").value.trim()||null,notes:$("en").value,created_by:session.user.id};let r=id?await db.from('expenses').update(p).eq('id',id):await db.from("expenses").insert(p);if(r.error)alert(friendlyError(r.error.message));else{closeModal();expensesPage()}}
async function editExpense(id){let x=(await db.from('expenses').select('*').eq('id',id).single()).data;if(x)eModal(x)}
async function usersPage(){$("main").innerHTML='<div class="empty">⏳ جاري التحميل...</div>';let r=await db.from("profiles").select("*,apartments(apartment_number)").order("created_at",{ascending:false}),a=r.data||[];$('main').innerHTML=head("المستخدمون","إدارة الأشخاص والصلاحيات",`<button class="primary" onclick="userModal()">+ مستخدم</button>`)+a.map(x=>`<div class="card user"><div class="avatar">👤</div><div style="flex:1"><b>${esc(x.full_name||x.username)}</b><p>${esc(x.username)} • ${esc(x.role)}</p><small>${x.apartments?'شقة '+esc(x.apartments.apartment_number):'غير مربوط'} • ${x.is_active?'🟢 مفعل':'🔴 معطل'}</small></div><div class="actions"><button onclick="editUser('${x.id}')">✏️</button><button onclick="toggleUser('${x.id}',${!!x.is_active})">${x.is_active?'تعطيل':'تفعيل'}</button></div></div>`).join("")}
async function userModal(){let apts=await getApartmentsList();openModal("إنشاء مستخدم",`<div class="notice">سيتم إنشاء حساب Auth + Profile عبر Edge Function. لا يتم وضع service-role key في المتصفح.</div><input id="un" placeholder="Username"><input id="uf" placeholder="الاسم الكامل"><input id="up" type="password" placeholder="كلمة مرور مؤقتة (8+)"><label class="label">الشقة (اختياري)</label><select id="ua">${aptOptionsHTML(apts,null,'apartment_number','بدون ربط بشقة')}</select><select id="ur"><option value="resident">ساكن</option><option value="admin">Admin</option><option value="viewer">مشاهد فقط (Viewer)</option></select><div class="buttons"><button class="primary" onclick="createUser()">إنشاء</button><button onclick="closeModal()">إلغاء</button></div>`)}
async function createUser(){let body={username:$("un").value.trim(),full_name:$("uf").value.trim(),password:$("up").value,apartment_number:$("ua").value.trim()||null,role:$("ur").value};if(!body.username||body.password.length<8)return alert("Username وكلمة مرور 8 أحرف على الأقل مطلوبان");let r=await db.functions.invoke("create-user",{body});if(r.error)return alert(friendlyError(r.error.message));alert("تم إنشاء المستخدم");closeModal();usersPage()}
async function editUser(id){let x=(await db.from('profiles').select('*').eq('id',id).single()).data;if(!x)return;let apts=await getApartmentsList();openModal('تعديل المستخدم',`<input id="uf" value="${esc(x.full_name||'')}" placeholder="الاسم"><label class="label">الشقة (اختياري)</label><select id="ua">${aptOptionsHTML(apts,x.apartment_id,'id','بدون ربط بشقة')}</select><select id="ur"><option value="resident" ${x.role==='resident'?'selected':''}>ساكن</option><option value="admin" ${x.role==='admin'?'selected':''}>Admin</option><option value="viewer" ${x.role==='viewer'?'selected':''}>مشاهد فقط (Viewer)</option></select><div class="buttons"><button class="primary" onclick="updateUser('${id}')">حفظ</button></div>`)}
async function updateUser(id){let r=await db.from('profiles').update({full_name:$("uf").value,apartment_id:$("ua").value||null,role:$("ur").value}).eq('id',id);if(r.error)return alert(friendlyError(r.error.message));closeModal();usersPage()}
async function toggleUser(id,state){let r=await db.from('profiles').update({is_active:!state}).eq('id',id);if(r.error)alert(friendlyError(r.error.message));else usersPage()}
async function filesPage(){$("main").innerHTML='<div class="empty">⏳ جاري التحميل...</div>';let r=await db.from('attachments').select("*").order('created_at',{ascending:false}),a=r.data||[];$('main').innerHTML=head("المرفقات","فواتير، صور وفيديوهات",`<button class="primary" onclick="fileModal()">+ رفع ملف</button>`)+(a.map(f=>`<div class="card">${fileRow(f)}<div class="actions"><button class="danger" onclick="deleteFile('${f.id}','${f.file_path}')">حذف</button></div></div>`).join("")||'<div class="empty">لا توجد مرفقات</div>')}
async function fileModal(){let apts=await getApartmentsList();openModal('رفع مرفقات',`<input id="fi" type="file" multiple accept="image/*,video/*,.pdf,.doc,.docx,.xlsx"><label class="label">الشقة (اختياري)</label><select id="fa" onchange="loadViolationsForFile()">${aptOptionsHTML(apts,null,'id','بدون ربط بشقة')}</select><label class="label">مرتبط بمخالفة (اختياري)</label><select id="fv"><option value="">بدون ربط بمخالفة</option></select><div class="notice">الملفات خاصة. الـResident يرى فقط الملفات المرتبطة بشقته.</div><div class="buttons"><button class="primary" onclick="uploadFiles()">رفع</button><button onclick="closeModal()">إلغاء</button></div>`)}
async function loadViolationsForFile(){let apId=$('fa').value;if(!apId){$('fv').innerHTML='<option value="">بدون ربط بمخالفة</option>';return}let r=await db.from('violations').select('*').eq('apartment_id',apId).order('created_at',{ascending:false});$('fv').innerHTML='<option value="">بدون ربط بمخالفة</option>'+(r.data||[]).map(v=>`<option value="${v.id}">${esc(v.violation_type)} - ${money(v.amount)}</option>`).join('')}
async function uploadFiles(){let files=[...$("fi").files],apId=$("fa").value||null,vid=$("fv").value||null;if(!files.length)return alert('اختر ملفًا');for(let f of files){let path=`${apId||'general'}/${Date.now()}-${Math.random().toString(36).slice(2)}-${f.name}`;let r=await db.storage.from('building-files').upload(path,f);if(r.error)return alert(friendlyError(r.error.message));let m=await db.from('attachments').insert({apartment_id:apId,violation_id:vid,file_path:path,file_name:f.name,mime_type:f.type,file_size:f.size,uploaded_by:session.user.id});if(m.error)return alert(friendlyError(m.error.message))}alert('تم رفع الملفات');closeModal();filesPage()}
async function downloadFile(path){let r=await db.storage.from('building-files').createSignedUrl(path,3600);if(r.error)return alert(friendlyError(r.error.message));window.open(r.data.signedUrl,'_blank')}
async function deleteFile(id,path){if(!confirm('حذف الملف؟'))return;await db.storage.from('building-files').remove([path]);let r=await db.from('attachments').delete().eq('id',id);if(r.error)alert(friendlyError(r.error.message));else filesPage()}
async function notificationsPage(){let r=await db.from('notifications').select('*,apartments(apartment_number)').order('created_at',{ascending:false}).limit(100);$('main').innerHTML=head('التنبيهات','سجل رسائل التحصيل والمخالفات',`<button class="primary" onclick="runReminder()">🔔 تشغيل التذكير الآن</button>`)+(r.data||[]).map(x=>`<div class="card"><div class="between"><span>${esc(x.title)}<small>شقة ${esc(x.apartments?.apartment_number||'-')} • ${date(x.created_at)}</small></span><span class="pill">${x.is_read?'مقروء':'غير مقروء'}</span></div><small>${esc(x.message||'')}</small></div>`).join('')||'<div class="empty">لا توجد تنبيهات</div>'}
async function runReminder(){let r=await db.functions.invoke('send-reminders',{body:{manual:true}});if(r.error)return alert(friendlyError(r.error.message));alert('تم تشغيل التذكيرات');notificationsPage()}
async function auditPage(){let r=await db.from("audit_logs").select("*").order("created_at",{ascending:false}).limit(100);$('main').innerHTML=head("سجل العمليات","آخر العمليات")+(r.data||[]).map(x=>`<div class="card row"><span>${esc(x.action)}<small>${date(x.created_at)} • ${esc(x.entity_type||'')}</small></span></div>`).join("")||'<div class="empty">لا يوجد سجل</div>'}
async function maintenancePage(){let r=await db.from('maintenance_contacts').select('*').order('role'),list=r.data||[],isAdmin=me.role==='admin';$('main').innerHTML=head('أرقام الصيانة','فريق الصيانة والخدمات الخاصة بالبرج',isAdmin?`<button class="primary" onclick="contactModal()">+ إضافة رقم</button>`:'')+(list.map(c=>`<div class="card"><div class="between"><div><b>${esc(c.name)}</b><p class="muted">${esc(c.role)}</p></div></div>${c.notes?`<small class="muted">${esc(c.notes)}</small>`:''}<div class="actions">${c.phone?`<button class="success" onclick="callContact('${esc(c.phone)}')">📞 اتصال</button><button onclick="waContact('${esc(c.phone)}','${esc(c.name)}')">💬 واتساب</button>`:'<small class="muted">لا يوجد رقم مسجل</small>'}${isAdmin?`<button onclick='contactModal(${JSON.stringify(c).replace(/'/g,"&#39;")})'>✏️</button><button class="danger" onclick="deleteContact('${c.id}')">حذف</button>`:''}</div></div>`).join('')||'<div class="empty">لا توجد أرقام مسجلة بعد</div>')}
function callContact(phone){let p=normalizeWhatsAppPhone(phone);window.open('tel:'+(p?'+'+p:phone.replace(/\s/g,'')))}
function waContact(phone,name){let p=normalizeWhatsAppPhone(phone);if(!p)return alert('رقم غير صحيح');window.open(whatsappUrl(p,`🏢 برج الرسالة\nبخصوص الصيانة، برجاء التواصل.\n- ${name}`),'_blank')}
function contactModal(x={}){openModal(x.id?'تعديل رقم صيانة':'إضافة رقم صيانة',`<input id="cn" value="${esc(x.name||'')}" placeholder="الاسم"><input id="cr" value="${esc(x.role||'')}" placeholder="التخصص مثل نجار / سباك / أسانسير / كاميرات"><input id="cp" value="${esc(x.phone||'')}" placeholder="رقم التليفون"><textarea id="cnotes" placeholder="ملاحظات">${esc(x.notes||'')}</textarea><div class="buttons"><button class="primary" onclick="saveContact('${x.id||''}')">حفظ</button><button onclick="closeModal()">إلغاء</button></div>`)}
async function saveContact(id){let p={name:$('cn').value.trim(),role:$('cr').value.trim(),phone:$('cp').value.trim(),notes:$('cnotes').value.trim()};if(!p.name||!p.role)return alert('اكتب الاسم والتخصص على الأقل');if(!id)p.created_by=session.user.id;let r=id?await db.from('maintenance_contacts').update(p).eq('id',id):await db.from('maintenance_contacts').insert(p);if(r.error)return alert(friendlyError(r.error.message));closeModal();maintenancePage()}
async function deleteContact(id){if(!confirm('حذف رقم الصيانة؟'))return;let r=await db.from('maintenance_contacts').delete().eq('id',id);if(r.error)alert(friendlyError(r.error.message));else maintenancePage()}
async function announcementsPage(){$("main").innerHTML='<div class="empty">⏳ جاري التحميل...</div>';let isAdmin=me.role==='admin',r=await db.from('announcements').select('*').order('pinned',{ascending:false}).order('created_at',{ascending:false}),list=r.data||[];$('main').innerHTML=head('التعميمات','رسائل عامة لكل السكان',isAdmin?`<button class="primary" onclick="announcementModal()">+ تعميم جديد</button>`:'')+(list.map(x=>`<div class="card"><div class="between"><b>${x.pinned?'📌 ':''}${esc(x.title)}</b><small>${date(x.created_at)}</small></div><p>${esc(x.message)}</p>${isAdmin?`<div class="actions"><button onclick="broadcastWA('${x.id}')">💬 إرسال للشقق</button><button onclick="deleteAnnouncement('${x.id}')">🗑️ حذف</button></div>`:''}</div>`).join('')||'<div class="empty">لا توجد تعميمات بعد</div>')}
function announcementModal(){openModal('تعميم جديد',`<input id="ant" placeholder="عنوان التعميم"><textarea id="anm" placeholder="نص الرسالة" rows="4"></textarea><label class="label"><input id="anp" type="checkbox" style="width:auto;display:inline-block"> تثبيت في الأعلى</label><div class="buttons"><button class="primary" onclick="saveAnnouncement()">نشر</button><button onclick="closeModal()">إلغاء</button></div>`)}
async function saveAnnouncement(){let title=$('ant').value.trim(),message=$('anm').value.trim();if(!title||!message)return alert('اكتب العنوان والرسالة');let r=await db.from('announcements').insert({title,message,pinned:$('anp').checked,created_by:session.user.id});if(r.error)return alert(friendlyError(r.error.message));closeModal();announcementsPage()}
async function deleteAnnouncement(id){if(!confirm('حذف التعميم؟'))return;let r=await db.from('announcements').delete().eq('id',id);if(r.error)alert(friendlyError(r.error.message));else announcementsPage()}
async function broadcastWA(id){let a=(await db.from('announcements').select('*').eq('id',id).single()).data;if(!a)return;window.__broadcastAnnouncement=a;let apts=(await db.from('apartments').select('*').eq('is_active',true).order('apartment_number')).data||[];let withPhone=apts.filter(x=>normalizeWhatsAppPhone(x.phone));if(!withPhone.length)return alert('لا توجد شقق بأرقام واتساب صحيحة');openModal('إرسال التعميم عبر واتساب',`<div class="notice">هيتفتحلك تاب واتساب منفصل لكل شقة، دوس على كل زرار على حدة (المتصفح بيمنع فتح أكتر من تاب مرة واحدة تلقائيًا).</div>`+withPhone.map(x=>`<div class="row"><span>شقة ${esc(x.apartment_number)}<small>${esc(x.resident_name||'')}</small></span><button onclick="sendAnnouncementTo('${x.phone}')">💬 إرسال</button></div>`).join(''))}
function sendAnnouncementTo(phone){let a=window.__broadcastAnnouncement;if(!a)return;let p=normalizeWhatsAppPhone(phone);if(!p)return alert('رقم غير صحيح');window.open(whatsappUrl(p,`📢 ${a.title}\n\n${a.message}`),'_blank')}
async function myPage(){let a=(await db.from("apartments").select("*").eq("id",me.apartment_id).single()).data,v=(await db.from("violations").select("*").eq("apartment_id",me.apartment_id).order("created_at",{ascending:false})).data||[],c=(await db.from('monthly_charges').select('*').eq('apartment_id',me.apartment_id).order('period_month',{ascending:false}).limit(12)).data||[],p=(await db.from('payments').select('*').eq('apartment_id',me.apartment_id).order('payment_date',{ascending:false}).limit(12)).data||[],f=(await db.from('attachments').select('*').eq('apartment_id',me.apartment_id).order('created_at',{ascending:false})).data||[],an=(await db.from('announcements').select('*').order('pinned',{ascending:false}).order('created_at',{ascending:false}).limit(3)).data||[];
  let dueCharges=c.filter(x=>x.status!=='paid'&&x.status!=='cancelled').reduce((s,x)=>s+((+x.amount||0)-(+x.paid_amount||0)),0);
  let dueViolations=v.filter(x=>!['paid','cancelled'].includes(x.status)).reduce((s,x)=>s+(+x.amount||0),0);
  let totalDue=dueCharges+dueViolations;
  $('main').innerHTML=head('شقتي','ملخص حسابك')+
  (an.length?`<div class="card"><h3>📢 آخر التعميمات</h3>${an.map(x=>`<div class="row"><span>${x.pinned?'📌 ':''}${esc(x.title)}<small>${esc(x.message)}</small></span><small>${date(x.created_at)}</small></div>`).join('')}</div>`:'')+
  `<div class="hero">🏠<b>شقة ${esc(a?.apartment_number)}</b><small>${esc(a?.resident_name)}</small><strong style="font-size:28px">${totalDue>0?money(totalDue)+' إجمالي مستحق عليك':'✓ حسابك متظبط بالكامل'}</strong>${totalDue>0?`<small>اشتراكات ${money(dueCharges)} + مخالفات ${money(dueViolations)}</small>`:''}</div><div class="grid"><div class="card"><h3>📅 الاشتراكات</h3>${c.map(chargeRow).join('')||'<div class="empty">لا توجد</div>'}</div><div class="card"><h3>💳 المدفوعات</h3>${p.map(x=>`<div class="row"><span>${date(x.payment_date)}<small>${esc(x.notes||'')}</small></span><b>${money(x.amount)}</b></div>`).join('')||'<div class="empty">لا توجد</div>'}</div></div><div class="card"><h3>⚠️ المخالفات</h3>${v.map(violationRow).join('')||'<div class="empty">لا توجد مخالفات 🎉</div>'}</div><div class="card"><h3>📎 المرفقات</h3>${f.map(fileRow).join('')||'<div class="empty">لا توجد مرفقات</div>'}</div>`}
async function myChargesPage(){return myPage()}async function myViolationsPage(){return myPage()}async function myPaymentsPage(){return myPage()}async function myFilesPage(){return myPage()}
async function logout(){await db.auth.signOut();location.reload()}
(async()=>{let s=await db.auth.getSession();if(s.data.session){session=s.data.session;let q=await db.from('profiles').select('*').eq('id',session.user.id).single();if(q.data?.is_active){me=q.data;$("login").classList.add('hidden');$("app").classList.remove('hidden');$("who").textContent=(me.full_name||me.username)+' • '+me.role;buildNav();me.must_change_password?passwordPage():me.role==='resident'?myPage():dashboardPage()}}})();
</script></body></html>
