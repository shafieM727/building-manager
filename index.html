<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.json"><title>برج الرسالة</title>
<link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<div id="login" class="login"><div class="login-card"><div class="logo">🏢</div><h1>برج الرسالة</h1><p>نظام إدارة البرج</p>
<input id="u" placeholder="اسم المستخدم"><input id="p" type="password" placeholder="كلمة المرور">
<button onclick="login()">دخول</button><div id="err"></div></div></div>
<div id="app" hidden><header><b>🏢 برج الرسالة</b><span id="who"></span><button onclick="logout()">خروج</button></header>
<aside id="side"></aside><main id="main"></main><nav id="nav"></nav></div>
<script>
const URL="https://krnrgdsxecellehuezqg.supabase.co",KEY="sb_publishable__Ctgcy0njM0Vy5fA3LcHrg_ooMv7o8u",db=supabase.createClient(URL,KEY);
let me,session;const $=x=>document.getElementById(x),money=n=>new Intl.NumberFormat("ar-EG",{style:"currency",currency:"EGP",maximumFractionDigits:0}).format(+n||0),date=x=>x?new Date(x).toLocaleDateString("ar-EG"):"-",esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function nav(){let a=me.role==="admin",m=a?[["dashboard","الرئيسية","🏠"],["apartments","الشقق","🏢"],["violations","المخالفات","⚠️"],["payments","المدفوعات","💳"],["expenses","المصروفات","🧾"],["users","المستخدمون","👥"],["files","المرفقات","📎"],["audit","السجل","🕘"]]:[["my","شقتي","🏠"]];$("side").innerHTML=m.map(x=>`<button onclick="${x[0]}Page()">${x[2]} ${x[1]}</button>`).join("");$("nav").innerHTML=m.slice(0,5).map(x=>`<button onclick="${x[0]}Page()">${x[2]}<small>${x[1]}</small></button>`).join("")}
async function login(){let u=$("u").value.trim().toLowerCase(),p=$("p").value;if(!u||!p)return $("err").textContent="أدخل البيانات";let r=await db.auth.signInWithPassword({email:u+"@building.local",password:p});if(r.error)return $("err").textContent="اسم المستخدم أو كلمة المرور غير صحيحة";session=r.data.session;let q=await db.from("profiles").select("*").eq("id",session.user.id).single();if(q.error||!q.data?.is_active){await db.auth.signOut();return $("err").textContent="الحساب غير مفعّل"}me=q.data;$("login").hidden=true;$("app").hidden=false;$("who").textContent=(me.full_name||me.username)+" • "+me.role;nav();me.must_change_password?passPage():me.role==="admin"?dashboardPage():myPage()}
function passPage(){$("main").innerHTML=`<section class="card center"><h2>🔐 تغيير كلمة المرور</h2><p>يجب تغييرها قبل المتابعة.</p><input id="n1" type="password" placeholder="كلمة المرور الجديدة"><input id="n2" type="password" placeholder="تأكيد كلمة المرور"><button onclick="savePass()">حفظ</button><div id="pm"></div></section>`}
async function savePass(){let a=$("n1").value,b=$("n2").value;if(a.length<8)return $("pm").textContent="8 أحرف على الأقل";if(a!==b)return $("pm").textContent="كلمتا المرور غير متطابقتين";let r=await db.auth.updateUser({password:a});if(r.error)return $("pm").textContent=r.error.message;await db.from("profiles").update({must_change_password:false}).eq("id",session.user.id);me.must_change_password=false;dashboardPage()}
function head(t,s,b=""){return `<div class="head"><div><h2>${t}</h2><p>${s||""}</p></div>${b}</div>`}
async function dashboardPage(){let[a,v,p,e]=await Promise.all([db.from("apartments").select("*"),db.from("violations").select("*"),db.from("payments").select("*"),db.from("expenses").select("*")]),un=(v.data||[]).filter(x=>x.status!=="paid"&&x.status!=="cancelled"),sum=x=>(x||[]).reduce((s,r)=>s+(+r.amount||0),0);$("main").innerHTML=head("لوحة التحكم","ملخص برج الرسالة")+`<div class="stats"><div>🏢<b>${a.data?.length||0}</b><small>الشقق</small></div><div>💰<b>${money(sum(p.data))}</b><small>المدفوعات</small></div><div class="red">⚠️<b>${money(sum(un))}</b><small>مخالفات مستحقة</small></div><div>🧾<b>${money(e.data?.length?sum(e.data):0)}</b><small>المصروفات</small></div></div><div class="card"><h3>تنبيهات</h3>${un.slice(0,8).map(x=>`<div class="row"><span>${esc(x.violation_type)}<small>التحصيل: ${date(x.due_date)}</small></span><b>${money(x.amount)}</b></div>`).join("")||'<div class="empty">لا توجد تنبيهات 🎉</div>'}</div>`}
async function apartmentsPage(){let r=await db.from("apartments").select("*").order("apartment_number"),a=r.data||[];$("main").innerHTML=head("الشقق",`${a.length} شقة`,`<button onclick="addApt()">+ شقة</button>`)+`<input class="search" id="sq" oninput="filterApt()" placeholder="🔎 بحث"><div id="alist">${a.map(x=>`<div class="card apt" data-q="${esc((x.apartment_number+" "+x.resident_name).toLowerCase())}"><div class="between"><b>شقة ${esc(x.apartment_number)}</b><span>${money(x.monthly_fee)} / شهر</span></div><p>${esc(x.resident_name||"لا يوجد ساكن")}</p><small>${esc(x.phone||"لا يوجد رقم")}</small></div>`).join("")||'<div class="empty">لا توجد شقق</div>'}</div>`}
function filterApt(){let q=$("sq").value.toLowerCase();document.querySelectorAll(".apt").forEach(x=>x.style.display=x.dataset.q.includes(q)?"block":"none")}
async function addApt(){let n=prompt("رقم الشقة");if(!n)return;let name=prompt("اسم الساكن")||"",phone=prompt("رقم WhatsApp")||"",fee=+prompt("الاشتراك الشهري","500")||0,r=await db.from("apartments").insert({apartment_number:n,resident_name:name,phone,monthly_fee:fee});if(r.error)alert(r.error.message);else apartmentsPage()}
async function violationsPage(){let r=await db.from("violations").select("*, apartments(apartment_number,phone)").order("created_at",{ascending:false}),a=r.data||[];$("main").innerHTML=head("المخالفات","القيمة وموعد التحصيل",`<button onclick="addV()">+ مخالفة</button>`)+a.map(v=>`<div class="card"><div class="between"><div><b>شقة ${esc(v.apartments?.apartment_number)}</b><p>${esc(v.violation_type)}</p></div><strong>${money(v.amount)}</strong></div><small>📅 ${date(v.due_date)} • ${esc(v.status||"unpaid")}</small><div class="actions"><button onclick="wa('${v.id}')">💬 WhatsApp</button><button onclick="paid('${v.id}')">✓ مدفوعة</button></div></div>`).join("")||'<div class="empty">لا توجد مخالفات</div>'}
async function addV(){let a=(await db.from("apartments").select("*")).data||[],n=prompt("رقم الشقة"),ap=a.find(x=>String(x.apartment_number)===n);if(!ap)return;let t=prompt("نوع المخالفة");if(!t)return;let amount=+prompt("القيمة","500")||0,due=prompt("موعد التحصيل YYYY-MM-DD")||null,r=await db.from("violations").insert({apartment_id:ap.id,violation_type:t,amount,due_date:due,status:"unpaid",created_by:session.user.id});if(r.error)alert(r.error.message);else violationsPage()}
async function paid(id){let r=await db.from("violations").update({status:"paid"}).eq("id",id);if(r.error)alert(r.error.message);else violationsPage()}
async function wa(id){let q=await db.from("violations").select("*,apartments(*)").eq("id",id).single(),v=q.data,ph=(v?.apartments?.phone||"").replace(/\D/g,"");if(!ph)return alert("لا يوجد رقم");let t=`🏢 برج الرسالة\nالشقة: ${v.apartments.apartment_number}\nالمخالفة: ${v.violation_type}\nالقيمة: ${money(v.amount)}\nموعد التحصيل: ${date(v.due_date)}\nبرجاء التكرم بالسداد.`;open("https://wa.me/"+ph+"?text="+encodeURIComponent(t),"_blank")}
async function paymentsPage(){let r=await db.from("payments").select("*,apartments(apartment_number)").order("payment_date",{ascending:false});$("main").innerHTML=head("المدفوعات","سجل التحصيل",`<button onclick="addP()">+ دفعة</button>`)+(r.data||[]).map(x=>`<div class="card row"><span>شقة ${esc(x.apartments?.apartment_number)}<small>${date(x.payment_date)}</small></span><b>${money(x.amount)}</b></div>`).join("")||'<div class="empty">لا توجد مدفوعات</div>'}
async function addP(){let a=(await db.from("apartments").select("*")).data||[],n=prompt("رقم الشقة"),ap=a.find(x=>String(x.apartment_number)===n);if(!ap)return;let amount=+prompt("المبلغ")||0,r=await db.from("payments").insert({apartment_id:ap.id,amount,created_by:session.user.id});if(r.error)alert(r.error.message);else paymentsPage()}
async function expensesPage(){let r=await db.from("expenses").select("*").order("expense_date",{ascending:false});$("main").innerHTML=head("المصروفات","مصروفات البرج",`<button onclick="addE()">+ مصروف</button>`)+(r.data||[]).map(x=>`<div class="card row"><span>${esc(x.title)}<small>${date(x.expense_date)}</small></span><b>${money(x.amount)}</b></div>`).join("")||'<div class="empty">لا توجد مصروفات</div>'}
async function addE(){let t=prompt("بيان المصروف");if(!t)return;let amount=+prompt("القيمة")||0,r=await db.from("expenses").insert({title:t,amount,created_by:session.user.id});if(r.error)alert(r.error.message);else expensesPage()}
async function usersPage(){let r=await db.from("profiles").select("*,apartments(apartment_number)").order("created_at",{ascending:false});$("main").innerHTML=head("المستخدمون","إدارة السكان والصلاحيات",`<button onclick="alert('سنفعل إنشاء المستخدم الآمن عبر Edge Function في الخطوة التالية')">+ مستخدم</button>`)+(r.data||[]).map(x=>`<div class="card user"><span class="avatar">👤</span><div><b>${esc(x.full_name||x.username)}</b><p>${esc(x.username)} • ${esc(x.role)}</p><small>${x.apartments?"شقة "+esc(x.apartments.apartment_number):"غير مربوط"} • ${x.is_active?"🟢":"🔴"}</small></div></div>`).join("")}
function filesPage(){$("main").innerHTML=head("المرفقات","فواتير وصور وفيديوهات")+`<div class="card empty">📎 سيتم ربط هذه الصفحة بـ Supabase Storage لرفع الملفات وربطها بالشقق والمخالفات.</div>`}
async function auditPage(){let r=await db.from("audit_logs").select("*").order("created_at",{ascending:false}).limit(100);$("main").innerHTML=head("سجل العمليات","آخر 100 عملية")+(r.data||[]).map(x=>`<div class="card row"><span>${esc(x.action)}<small>${date(x.created_at)}</small></span></div>`).join("")||'<div class="empty">لا يوجد سجل</div>'}
async function myPage(){let a=(await db.from("apartments").select("*").eq("id",me.apartment_id).single()).data,v=(await db.from("violations").select("*").eq("apartment_id",me.apartment_id)).data||[];$("main").innerHTML=head("شقتي","بيانات الاشتراك والمخالفات")+`<div class="hero">🏠<b>شقة ${esc(a?.apartment_number)}</b><small>${esc(a?.resident_name)}</small><strong>${money(a?.monthly_fee)} / شهر</strong></div><div class="card"><h3>⚠️ المخالفات</h3>${v.map(x=>`<div class="row"><span>${esc(x.violation_type)}<small>${date(x.due_date)}</small></span><b>${money(x.amount)}</b></div>`).join("")||'<div class="empty">لا توجد مخالفات 🎉</div>'}</div>`}
async function logout(){await db.auth.signOut();location.reload()}
</script></body></html>
