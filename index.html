<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>برج الرسالة — V4</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#0f172a;font-family:Arial,Tahoma,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:11px;padding:11px 14px;cursor:pointer;background:#e8eef5}.primary{background:#0f172a;color:#fff}.danger{background:#fee2e2;color:#991b1b}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#0f172a,#1e293b)}.loginbox{width:min(420px,100%);background:#fff;padding:30px;border-radius:25px;text-align:center;box-shadow:0 25px 70px #0005}.logo{font-size:58px}.loginbox input,.modal input,.modal select,.modal textarea{width:100%;padding:13px;margin:6px 0;border:1px solid #d8e0e9;border-radius:11px;background:#fff}.loginbox button{width:100%;margin-top:8px}.err{color:#b91c1c;min-height:22px;margin-top:8px}.hidden{display:none!important}header{height:66px;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:20}header small{display:block;color:#cbd5e1}#side{position:fixed;right:0;top:66px;bottom:0;width:225px;background:#fff;border-left:1px solid #e2e8f0;padding:16px;z-index:10}#side button{width:100%;background:transparent;text-align:right;margin-bottom:3px}#side button:hover{background:#f1f5f9}main{max-width:1100px;margin-right:225px;padding:22px 20px 90px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.head h2{margin:0 0 4px}.muted{color:#64748b}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.card{background:#fff;border:1px solid #e5ebf2;border-radius:18px}.stat{padding:18px}.stat b{display:block;font-size:24px;margin:8px 0}.stat small,.row small{display:block;color:#64748b;margin-top:4px}.card{padding:17px;margin-top:15px}.row,.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.row{padding:12px 0;border-bottom:1px solid #eef2f6}.row:last-child{border-bottom:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.search{width:100%;padding:13px;border:1px solid #d8e0e9;border-radius:11px;margin-bottom:10px}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#ecfdf5;color:#047857;font-size:12px}.badge.red{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.empty{text-align:center;padding:30px;color:#64748b}.hero{background:#0f172a;color:#fff;padding:22px;border-radius:20px;display:grid;gap:7px}.user{display:flex;align-items:center;gap:12px}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#eef2ff}.modalwrap{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px;z-index:50}.modal{background:#fff;width:min(520px,100%);max-height:90vh;overflow:auto;padding:20px;border-radius:18px}.modal h3{margin-top:0}.modal .buttons{display:flex;gap:8px;margin-top:10px}#nav{display:none}
@media(max-width:760px){#side{display:none}main{margin-right:0;padding:15px 13px 90px}.stats{grid-template-columns:repeat(2,1fr)}.stat{padding:14px}.stat b{font-size:20px}.grid{grid-template-columns:1fr}.head h2{font-size:21px}#nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;z-index:30;justify-content:space-around;padding:5px 2px calc(5px + env(safe-area-inset-bottom))}#nav button{background:transparent;display:flex;flex-direction:column;align-items:center;font-size:18px;padding:4px}#nav small{font-size:9px}.card{border-radius:15px}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><div class="logo">🏢</div><h1>برج الرسالة</h1><p class="muted">نظام إدارة البرج</p><input id="username" placeholder="Username مثل admin"><input id="password" type="password" placeholder="Password"><button class="primary" onclick="login()">تسجيل الدخول</button><div id="loginerr" class="err"></div></div></div>
<div id="app" class="hidden"><header><div><b>🏢 برج الرسالة</b><small id="who"></small></div><button onclick="logout()">خروج</button></header><aside id="side"></aside><main id="main"></main><nav id="nav"></nav></div><div id="modal"></div>
<script>
const SUPABASE_URL="https://krnrgdsxecellehuezqg.supabase.co";
const SUPABASE_KEY="sb_publishable__Ctgcy0njM0Vy5fA3LcHrg_ooMv7o8u";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let me=null,session=null;
const $=id=>document.getElementById(id), esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])), money=x=>new Intl.NumberFormat("ar-EG",{style:"currency",currency:"EGP",maximumFractionDigits:0}).format(+x||0), date=x=>x?new Date(x).toLocaleDateString("ar-EG"):"-";
function emailFor(u){u=u.trim().toLowerCase(); return u.includes("@")?u:u+"@building.local"}
async function login(){let u=$("username").value,p=$("password").value;if(!u||!p)return $("loginerr").textContent="أدخل اسم المستخدم وكلمة المرور";let r=await db.auth.signInWithPassword({email:emailFor(u),password:p});if(r.error)return $("loginerr").textContent="اسم المستخدم أو كلمة المرور غير صحيحة";session=r.data.session;let q=await db.from("profiles").select("*").eq("id",session.user.id).single();if(q.error||!q.data?.is_active){await db.auth.signOut();return $("loginerr").textContent="الحساب غير مفعّل أو لا يوجد Profile مربوط به"}me=q.data;$("login").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=(me.full_name||me.username)+" • "+me.role;buildNav();me.must_change_password?passwordPage():me.role==="admin"?dashboardPage():myPage()}
function buildNav(){let a=me.role==="admin",items=a?[["dashboard","الرئيسية","🏠"],["apartments","الشقق","🏢"],["violations","المخالفات","⚠️"],["payments","المدفوعات","💳"],["expenses","المصروفات","🧾"],["users","المستخدمون","👥"],["files","المرفقات","📎"],["audit","السجل","🕘"]]:[["my","شقتي","🏠"]];$("side").innerHTML=items.map(x=>`<button onclick="${x[0]}Page()">${x[2]} ${x[1]}</button>`).join("");$("nav").innerHTML=items.slice(0,5).map(x=>`<button onclick="${x[0]}Page()">${x[2]}<small>${x[1]}</small></button>`).join("")}
function passwordPage(){$("main").innerHTML=`<div class="card" style="max-width:520px;margin:40px auto;text-align:center"><h2>🔐 تغيير كلمة المرور</h2><p class="muted">يجب تغيير كلمة المرور عند أول دخول.</p><input id="np1" type="password" placeholder="كلمة المرور الجديدة"><input id="np2" type="password" placeholder="تأكيد كلمة المرور"><button class="primary" onclick="savePassword()">حفظ واستمرار</button><div id="pmsg" class="err"></div></div>`}
async function savePassword(){let a=$("np1").value,b=$("np2").value;if(a.length<8)return $("pmsg").textContent="استخدم 8 أحرف على الأقل";if(a!==b)return $("pmsg").textContent="كلمتا المرور غير متطابقتين";let r=await db.auth.updateUser({password:a});if(r.error)return $("pmsg").textContent=r.error.message;await db.from("profiles").update({must_change_password:false}).eq("id",session.user.id);me.must_change_password=false;dashboardPage()}
function head(t,s,b=""){return `<div class="head"><div><h2>${t}</h2><div class="muted">${s||""}</div></div>${b}</div>`}
async function dashboardPage(){let[a,v,p,e]=await Promise.all([db.from("apartments").select("*"),db.from("violations").select("*"),db.from("payments").select("*"),db.from("expenses").select("*")]),un=(v.data||[]).filter(x=>!["paid","cancelled"].includes(x.status)),sum=a=>(a||[]).reduce((s,x)=>s+(+x.amount||0),0);$("main").innerHTML=head("لوحة التحكم","ملخص برج الرسالة")+`<div class="stats"><div class="stat">🏢<b>${a.data?.length||0}</b><small>الشقق</small></div><div class="stat">💰<b>${money(sum(p.data))}</b><small>المدفوعات</small></div><div class="stat">⚠️<b>${money(sum(un))}</b><small>مخالفات مستحقة</small></div><div class="stat">🧾<b>${money(sum(e.data))}</b><small>المصروفات</small></div></div><div class="card"><h3>المخالفات التي تحتاج متابعة</h3>${un.slice(0,8).map(x=>`<div class="row"><span>${esc(x.violation_type)}<small>التحصيل: ${date(x.due_date)}</small></span><b>${money(x.amount)}</b></div>`).join("")||'<div class="empty">لا توجد مخالفات مستحقة 🎉</div>'}</div>`}
async function apartmentsPage(){let r=await db.from("apartments").select("*").order("apartment_number"),a=r.data||[];$("main").innerHTML=head("الشقق",`${a.length} شقة`,`<button class="primary" onclick="aptModal()">+ إضافة شقة</button>`)+`<input class="search" id="aq" oninput="filterApt()" placeholder="🔎 رقم الشقة أو اسم الساكن"><div id="aptlist">${a.map(x=>`<div class="card apt" data-q="${esc((x.apartment_number+" "+x.resident_name).toLowerCase())}"><div class="between"><b>شقة ${esc(x.apartment_number)}</b><span class="badge">${money(x.monthly_fee)} / شهر</span></div><p>${esc(x.resident_name||"لا يوجد ساكن")}</p><small>${esc(x.phone||"لا يوجد رقم")}</small><div class="actions">${x.phone?`<button onclick="sendApartmentWA('${x.id}')">💬 WhatsApp</button>`:""}</div></div>`).join("")||'<div class="empty">لا توجد شقق</div>'}</div>`}
async function sendApartmentWA(id){
  let q=await db.from("apartments").select("*").eq("id",id).single(),a=q.data;
  if(q.error||!a) return alert("تعذر تحميل بيانات الشقة");
  let phone=normalizeWhatsAppPhone(a.phone);
  if(!phone) return alert("رقم WhatsApp غير صحيح. اكتب الرقم المصري مثل 01012345678 أو بالصيغة الدولية +201012345678");
  let t=`🏢 برج الرسالة\nالشقة: ${a.apartment_number}\nمرحبًا ${a.resident_name||""}\nهذه رسالة من إدارة البرج.`;
  window.open(whatsappUrl(phone,t),"_blank");
}
function filterApt(){let q=$("aq").value.toLowerCase();document.querySelectorAll(".apt").forEach(x=>x.style.display=x.dataset.q.includes(q)?"block":"none")}
function openModal(t,body){$("modal").innerHTML=`<div class="modalwrap" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>${t}</h3>${body}</div></div>`}
function closeModal(){$("modal").innerHTML=""}
function aptModal(){openModal("إضافة شقة",`<input id="an" placeholder="رقم الشقة"><input id="rn" placeholder="اسم الساكن"><input id="ph" placeholder="رقم WhatsApp — مثال 01012345678"><input id="mf" type="number" placeholder="الاشتراك الشهري"><div class="buttons"><button class="primary" onclick="saveApt()">حفظ</button><button onclick="closeModal()">إلغاء</button></div>`)}
async function saveApt(){let r=await db.from("apartments").insert({apartment_number:$("an").value.trim(),resident_name:$("rn").value.trim(),phone:$("ph").value.trim(),monthly_fee:+$("mf").value||0});if(r.error)return alert(r.error.message);closeModal();apartmentsPage()}
async function violationsPage(){let r=await db.from("violations").select("*,apartments(apartment_number,phone)").order("created_at",{ascending:false}),a=r.data||[];$("main").innerHTML=head("المخالفات","القيمة وموعد التحصيل",`<button class="primary" onclick="vModal()">+ مخالفة</button>`)+a.map(v=>`<div class="card"><div class="between"><div><b>شقة ${esc(v.apartments?.apartment_number)}</b><p>${esc(v.violation_type)}</p></div><strong>${money(v.amount)}</strong></div><small>📅 موعد التحصيل: ${date(v.due_date)} • ${esc(v.status||"unpaid")}</small><div class="actions"><button onclick="sendWA('${v.id}')">💬 WhatsApp</button><button onclick="markPaid('${v.id}')">✓ تم السداد</button></div></div>`).join("")||'<div class="empty">لا توجد مخالفات</div>'}
function vModal(){openModal("إضافة مخالفة",`<input id="va" placeholder="رقم الشقة"><input id="vt" placeholder="نوع المخالفة"><input id="vm" type="number" placeholder="قيمة المخالفة"><label>موعد التحصيل</label><input id="vd" type="date"><div class="buttons"><button class="primary" onclick="saveV()">حفظ</button><button onclick="closeModal()">إلغاء</button></div>`)}
async function saveV(){let a=(await db.from("apartments").select("*")).data||[],ap=a.find(x=>String(x.apartment_number)===$("va").value.trim());if(!ap)return alert("رقم الشقة غير موجود");let r=await db.from("violations").insert({apartment_id:ap.id,violation_type:$("vt").value.trim(),amount:+$("vm").value||0,due_date:$("vd").value||null,status:"unpaid",created_by:session.user.id});if(r.error)return alert(r.error.message);closeModal();violationsPage()}
async function markPaid(id){let r=await db.from("violations").update({status:"paid"}).eq("id",id);if(r.error)alert(r.error.message);else violationsPage()}
function normalizeWhatsAppPhone(raw){
  let p=String(raw||"").trim().replace(/[\s().-]/g,"");
  if(!p) return null;
  if(p.startsWith("00")) p=p.slice(2);
  if(p.startsWith("+")) p=p.slice(1);
  // Egypt: accept local 01xxxxxxxxx and convert to +20 automatically.
  if(p.startsWith("01") && p.length===11) p="20"+p;
  // Also accept 1xxxxxxxxx as an Egyptian mobile number.
  if(p.startsWith("1") && p.length===10) p="20"+p;
  // If the number was stored as 0201..., normalize it.
  if(p.startsWith("0201") && p.length===13) p=p.slice(1);
  return /^\d{8,15}$/.test(p) ? p : null;
}
function whatsappUrl(phone,text){
  const normalized=normalizeWhatsAppPhone(phone);
  if(!normalized) return null;
  return "https://wa.me/"+normalized+"?text="+encodeURIComponent(text);
}
async function sendWA(id){
  let q=await db.from("violations").select("*,apartments(*)").eq("id",id).single(),v=q.data;
  if(q.error||!v) return alert("تعذر تحميل بيانات المخالفة");
  let phone=normalizeWhatsAppPhone(v.apartments?.phone);
  if(!phone) return alert("رقم WhatsApp غير صحيح. اكتب الرقم المصري مثل 01012345678 أو بالصيغة الدولية +201012345678");
  let t=`🏢 برج الرسالة\nالشقة: ${v.apartments.apartment_number}\nالمخالفة: ${v.violation_type}\nالقيمة: ${money(v.amount)}\nموعد التحصيل: ${date(v.due_date)}\nبرجاء التكرم بالسداد.`;
  window.open(whatsappUrl(phone,t),"_blank");
}
async function paymentsPage(){let r=await db.from("payments").select("*,apartments(apartment_number)").order("payment_date",{ascending:false});$("main").innerHTML=head("المدفوعات","سجل التحصيل",`<button class="primary" onclick="pModal()">+ دفعة</button>`)+(r.data||[]).map(x=>`<div class="card row"><span>شقة ${esc(x.apartments?.apartment_number)}<small>${date(x.payment_date)}</small></span><b>${money(x.amount)}</b></div>`).join("")||'<div class="empty">لا توجد مدفوعات</div>'}
function pModal(){openModal("إضافة دفعة",`<input id="pa" placeholder="رقم الشقة"><input id="pm" type="number" placeholder="المبلغ"><input id="pn" placeholder="ملاحظات"><div class="buttons"><button class="primary" onclick="saveP()">حفظ</button><button onclick="closeModal()">إلغاء</button></div>`)}
async function saveP(){let a=(await db.from("apartments").select("*")).data||[],ap=a.find(x=>String(x.apartment_number)===$("pa").value.trim());if(!ap)return alert("رقم الشقة غير موجود");let r=await db.from("payments").insert({apartment_id:ap.id,amount:+$("pm").value||0,notes:$("pn").value,created_by:session.user.id});if(r.error)alert(r.error.message);else{closeModal();paymentsPage()}}
async function expensesPage(){let r=await db.from("expenses").select("*").order("expense_date",{ascending:false});$("main").innerHTML=head("المصروفات","مصروفات البرج",`<button class="primary" onclick="eModal()">+ مصروف</button>`)+(r.data||[]).map(x=>`<div class="card row"><span>${esc(x.title)}<small>${date(x.expense_date)}</small></span><b>${money(x.amount)}</b></div>`).join("")||'<div class="empty">لا توجد مصروفات</div>'}
function eModal(){openModal("إضافة مصروف",`<input id="et" placeholder="بيان المصروف"><input id="em" type="number" placeholder="القيمة"><textarea id="en" placeholder="ملاحظات"></textarea><div class="buttons"><button class="primary" onclick="saveE()">حفظ</button><button onclick="closeModal()">إلغاء</button></div>`)}
async function saveE(){let r=await db.from("expenses").insert({title:$("et").value,amount:+$("em").value||0,notes:$("en").value,created_by:session.user.id});if(r.error)alert(r.error.message);else{closeModal();expensesPage()}}
async function usersPage(){let r=await db.from("profiles").select("*,apartments(apartment_number)").order("created_at",{ascending:false});$("main").innerHTML=head("المستخدمون","إدارة الأشخاص والصلاحيات",`<button class="primary" onclick="userModal()">+ مستخدم</button>`)+(r.data||[]).map(x=>`<div class="card user"><div class="avatar">👤</div><div><b>${esc(x.full_name||x.username)}</b><p>${esc(x.username)} • ${esc(x.role)}</p><small>${x.apartments?"شقة "+esc(x.apartments.apartment_number):"غير مربوط"} • ${x.is_active?"🟢 مفعل":"🔴 معطل"}</small></div></div>`).join("")}
function userModal(){openModal("إنشاء مستخدم",`<p class="muted">سيتم إنشاء المستخدم بأمان عبر Supabase Edge Function. هذه الشاشة تحدد البيانات المطلوبة.</p><input id="un" placeholder="Username"><input id="uf" placeholder="الاسم الكامل"><input id="up" type="password" placeholder="كلمة مرور مؤقتة"><input id="ua" placeholder="رقم الشقة (اختياري)"><select id="ur"><option value="resident">ساكن</option><option value="admin">Admin</option></select><div class="buttons"><button class="primary" onclick="alert('يجب نشر Edge Function الخاصة بإنشاء المستخدم أولاً حتى لا نكشف Service Role Key في المتصفح.')">إنشاء</button><button onclick="closeModal()">إلغاء</button></div>`)}
function filesPage(){$("main").innerHTML=head("المرفقات","فواتير، صور وفيديوهات",`<button class="primary" onclick="fileModal()">+ رفع ملف</button>`)+`<div class="card"><p>سيتم استخدام Supabase Storage مع صلاحيات RLS وربط كل ملف بالشقة/المخالفة.</p><div class="empty">ارفع الملفات بعد إنشاء bucket باسم <b>building-files</b>.</div></div>`}
function fileModal(){openModal("رفع مرفق",`<input id="fi" type="file" multiple accept="image/*,video/*,.pdf"><p class="muted">يجب إنشاء Storage bucket باسم building-files أولاً.</p><div class="buttons"><button class="primary" onclick="uploadFiles()">رفع</button><button onclick="closeModal()">إلغاء</button></div>`)}
async function uploadFiles(){let files=[...$("fi").files];if(!files.length)return;for(let f of files){let path=`${session.user.id}/${Date.now()}-${f.name}`;let r=await db.storage.from("building-files").upload(path,f);if(r.error)return alert(r.error.message)}alert("تم رفع الملفات");closeModal();filesPage()}
async function auditPage(){let r=await db.from("audit_logs").select("*").order("created_at",{ascending:false}).limit(100);$("main").innerHTML=head("سجل العمليات","آخر العمليات")+(r.data||[]).map(x=>`<div class="card row"><span>${esc(x.action)}<small>${date(x.created_at)}</small></span></div>`).join("")||'<div class="empty">لا يوجد سجل</div>'}
async function myPage(){let a=(await db.from("apartments").select("*").eq("id",me.apartment_id).single()).data,v=(await db.from("violations").select("*").eq("apartment_id",me.apartment_id).order("created_at",{ascending:false})).data||[];$("main").innerHTML=head("شقتي","بيانات اشتراكك ومخالفاتك")+`<div class="hero">🏠<b>شقة ${esc(a?.apartment_number)}</b><small>${esc(a?.resident_name)}</small><strong>${money(a?.monthly_fee)} / شهر</strong></div><div class="card"><h3>⚠️ المخالفات</h3>${v.map(x=>`<div class="row"><span>${esc(x.violation_type)}<small>موعد التحصيل: ${date(x.due_date)}</small></span><b>${money(x.amount)}</b></div>`).join("")||'<div class="empty">لا توجد مخالفات 🎉</div>'}</div>`}
async function logout(){await db.auth.signOut();location.reload()}
</script></body></html>
