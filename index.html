<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.json"><title>برج الرسالة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#0f172a;font-family:Arial,Tahoma,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:11px;padding:11px 14px;cursor:pointer;background:#e8eef5}.primary{background:#0f172a;color:#fff}.danger{background:#fee2e2;color:#991b1b}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#0f172a,#1e293b)}.box{width:min(430px,100%);background:#fff;padding:30px;border-radius:25px;text-align:center;box-shadow:0 25px 70px #0005}.logo{font-size:58px}.box input,.modal input,.modal select,.modal textarea{width:100%;padding:13px;margin:6px 0;border:1px solid #d8e0e9;border-radius:11px}.box button{width:100%;margin-top:8px}.err{color:#b91c1c;min-height:22px;margin-top:8px}.hidden{display:none!important}header{height:66px;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:20}header small{display:block;color:#cbd5e1}#side{position:fixed;right:0;top:66px;bottom:0;width:225px;background:#fff;border-left:1px solid #e2e8f0;padding:16px;z-index:10}#side button{width:100%;background:transparent;text-align:right;margin-bottom:3px}main{max-width:1100px;margin-right:225px;padding:22px 20px 90px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.head h2{margin:0 0 4px}.muted{color:#64748b}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.card{background:#fff;border:1px solid #e5ebf2;border-radius:18px}.stat{padding:18px}.stat b{display:block;font-size:24px;margin:8px 0}.stat small,.row small{display:block;color:#64748b;margin-top:4px}.card{padding:17px;margin-top:15px}.row,.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.row{padding:12px 0;border-bottom:1px solid #eef2f6}.row:last-child{border-bottom:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.search{width:100%;padding:13px;border:1px solid #d8e0e9;border-radius:11px;margin-bottom:10px}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#ecfdf5;color:#047857;font-size:12px}.badge.red{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.empty{text-align:center;padding:30px;color:#64748b}.hero{background:#0f172a;color:#fff;padding:22px;border-radius:20px;display:grid;gap:7px}.user{display:flex;align-items:center;gap:12px}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#eef2ff}.modalwrap{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px;z-index:50}.modal{background:#fff;width:min(520px,100%);max-height:90vh;overflow:auto;padding:20px;border-radius:18px}.modal h3{margin-top:0}.buttons{display:flex;gap:8px;margin-top:10px}#nav{display:none}@media(max-width:760px){#side{display:none}main{margin-right:0;padding:15px 13px 90px}.stats{grid-template-columns:repeat(2,1fr)}.stat{padding:14px}.stat b{font-size:20px}.grid{grid-template-columns:1fr}#nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;z-index:30;justify-content:space-around;padding:5px 2px calc(5px + env(safe-area-inset-bottom))}#nav button{background:transparent;display:flex;flex-direction:column;align-items:center;font-size:18px;padding:4px}#nav small{font-size:9px}}
</style></head><body>
<div id="login" class="login"><div class="box"><div class="logo">🏢</div><h1>برج الرسالة</h1><p class="muted">نظام إدارة البرج</p><input id="u" placeholder="Username مثل admin"><input id="p" type="password" placeholder="Password"><button class="primary" onclick="login()">دخول</button><div id="le" class="err"></div></div></div>
<div id="app" class="hidden"><header><div><b>🏢 برج الرسالة</b><small id="who"></small></div><button onclick="logout()">خروج</button></header><aside id="side"></aside><main id="main"></main><nav id="nav"></nav></div><div id="modal"></div>
<script>
const URL="https://krnrgdsxecellehuezqg.supabase.co",KEY="sb_publishable__Ctgcy0njM0Vy5fA3LcHrg_ooMv7o8u",db=supabase.createClient(URL,KEY);
let me,session;const $=x=>document.getElementById(x),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),money=x=>new Intl.NumberFormat("ar-EG",{style:"currency",currency:"EGP",maximumFractionDigits:0}).format(+x||0),date=x=>x?new Date(x).toLocaleDateString("ar-EG"):"-";
const emailFor=u=>u.trim().toLowerCase().includes("@")?u.trim().toLowerCase():u.trim().toLowerCase()+"@building.local";
async function login(){let u=$("u").value,p=$("p").value;if(!u||!p)return $("le").textContent="أدخل البيانات";let r=await db.auth.signInWithPassword({email:emailFor(u),password:p});if(r.error)return $("le").textContent="اسم المستخدم أو كلمة المرور غير صحيحة";session=r.data.session;let q=await db.from("profiles").select("*").eq("id",session.user.id).single();if(q.error||!q.data?.is_active){await db.auth.signOut();return $("le").textContent="الحساب غير مفعّل أو لا يوجد Profile"}me=q.data;$("login").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=(me.full_name||me.username)+" • "+me.role;nav();me.must_change_password?passPage():me.role==="admin"?dashboardPage():myPage()}
function nav(){let a=me.role==="admin",m=a?[["dashboard","الرئيسية","🏠"],["apartments","الشقق","🏢"],["violations","المخالفات","⚠️"],["payments","المدفوعات","💳"],["expenses","المصروفات","🧾"],["users","المستخدمون","👥"],["files","المرفقات","📎"],["audit","السجل","🕘"]]:[["my","شقتي","🏠"]];$("side").innerHTML=m.map(x=>`<button onclick="${x[0]}Page()">${x[2]} ${x[1]}</button>`).join("");$("nav").innerHTML=m.slice(0,5).map(x=>`<button onclick="${x[0]}Page()">${x[2]}<small>${x[1]}</small></button>`).join("")}
function passPage(){$("main").innerHTML=`<div class="card" style="max-width:520px;margin:40px auto;text-align:center"><h2>🔐 تغيير كلمة المرور</h2><input id="p1" type="password" placeholder="كلمة المرور الجديدة"><input id="p2" type="password" placeholder="تأكيد كلمة المرور"><button class="primary" onclick="savePass()">حفظ</button><div id="pe" class="err"></div></div>`}
async function savePass(){let a=$("p1").value,b=$("p2").value;if(a.length<8)return $("pe").textContent="8 أحرف على الأقل";if(a!==b)return $("pe").textContent="كلمتا المرور غير متطابقتين";let r=await db.auth.updateUser({password:a});if(r.error)return $("pe").textContent=r.error.message;await db.from("profiles").update({must_change_password:false}).eq("id",session.user.id);me.must_change_password=false;me.role==="admin"?dashboardPage():myPage()}
const head=(t,s,b="")=>`<div class="head"><div><h2>${t}</h2><div class="muted">${s||""}</div></div>${b}</div>`;
async function dashboardPage(){let[a,v,p,e]=await Promise.all([db.from("apartments").select("*"),db.from("violations").select("*"),db.from("payments").select("*"),db.from("expenses").select("*")]),un=(v.data||[]).filter(x=>!["paid","cancelled"].includes(x.status));const sm=a=>(a||[]).reduce((s,x)=>s+(+x.amount||0),0);$("main").innerHTML=head("لوحة التحكم","ملخص البرج")+`<div class="stats"><div class="stat">🏢<b>${a.data?.length||0}</b><small>الشقق</small></div><div class="stat">💰<b>${money(sm(p.data))}</b><small>المدفوعات</small></div><div class="stat">⚠️<b>${money(sm(un))}</b><small>مخالفات مستحقة</small></div><div class="stat">🧾<b>${money(sm(e.data))}</b><small>المصروفات</small></div></div><div class="card"><h3>تنبيهات</h3>${un.slice(0,8).map(x=>`<div class="row"><span>${esc(x.violation_type)}<small>التحصيل: ${date(x.due_date)}</small></span><b>${money(x.amount)}</b></div>`).join("")||'<div class="empty">لا توجد مخالفات مستحقة 🎉</div>'}</div>`}
async function apartmentsPage(){let r=await db.from("apartments").select("*").order("apartment_number"),a=r.data||[];$("main").innerHTML=head("الشقق",`${a.length} شقة`,`<button class="primary" onclick="aptModal()">+ شقة</button>`)+`<input id="sq" class="search" oninput="filterA()" placeholder="🔎 بحث"><div id="alist">${a.map(x=>`<div class="card apt" data-q="${esc((x.apartment_number+" "+x.resident_name).toLowerCase())}"><div class="between"><b>شقة ${esc(x.apartment_number)}</b><span class="badge">${money(x.monthly_fee)} / شهر</span></div><p>${esc(x.resident_name||"")}</p><small>${esc(x.phone||"لا يوجد رقم")}</small></div>`).join("")||'<div class="empty">لا توجد شقق</div>'}</div>`}
function filterA(){let q=$("sq").value.toLowerCase();document.querySelectorAll(".apt").forEach(x=>x.style.display=x.dataset.q.includes(q)?"block":"none")}
function openM(t,b){$("modal").innerHTML=`<div class="modalwrap" onclick="if(event.target===this)closeM()"><div class="modal"><h3>${t}</h3>${b}</div></div>`}function closeM(){$("modal").innerHTML=""}
function aptModal(){openM("إضافة شقة",`<input id="an" placeholder="رقم الشقة"><input id="rn" placeholder="اسم الساكن"><input id="ph" placeholder="رقم WhatsApp"><input id="mf" type="number" placeholder="الاشتراك الشهري"><div class="buttons"><button class="primary" onclick="saveA()">حفظ</button><button onclick="closeM()">إلغاء</button></div>`)}
async function saveA(){let r=await db.from("apartments").insert({apartment_number:$("an").value,resident_name:$("rn").value,phone:$("ph").value,monthly_fee:+$("mf").value||0});if(r.error)alert(r.error.message);else{closeM();apartmentsPage()}}
async function violationsPage(){let r=await db.from("violations").select("*,apartments(apartment_number,phone)").order("created_at",{ascending:false}),a=r.data||[];$("main").innerHTML=head("المخالفات","القيمة وموعد التحصيل",`<button class="primary" onclick="vModal()">+ مخالفة</button>`)+a.map(v=>`<div class="card"><div class="between"><span><b>شقة ${esc(v.apartments?.apartment_number)}</b><p>${esc(v.violation_type)}</p></span><b>${money(v.amount)}</b></div><small>📅 ${date(v.due_date)} • ${esc(v.status)}</small><div class="actions"><button onclick="wa('${v.id}')">💬 WhatsApp</button><button onclick="paid('${v.id}')">✓ تم السداد</button></div></div>`).join("")||'<div class="empty">لا توجد مخالفات</div>'}
function vModal(){openM("إضافة مخالفة",`<input id="va" placeholder="رقم الشقة"><input id="vt" placeholder="نوع المخالفة"><input id="vm" type="number" placeholder="القيمة"><input id="vd" type="date"><div class="buttons"><button class="primary" onclick="saveV()">حفظ</button><button onclick="closeM()">إلغاء</button></div>`)}
async function saveV(){let a=(await db.from("apartments").select("*")).data||[],ap=a.find(x=>String(x.apartment_number)===$("va").value.trim());if(!ap)return alert("الشقة غير موجودة");let r=await db.from("violations").insert({apartment_id:ap.id,violation_type:$("vt").value,amount:+$("vm").value||0,due_date:$("vd").value||null,status:"unpaid",created_by:session.user.id});if(r.error)alert(r.error.message);else{closeM();violationsPage()}}
async function paid(id){let r=await db.from("violations").update({status:"paid"}).eq("id",id);if(r.error)alert(r.error.message);else violationsPage()}
async function wa(id){let q=await db.from("violations").select("*,apartments(*)").eq("id",id).single(),v=q.data,ph=(v?.apartments?.phone||"").replace(/\D/g,"");if(!ph)return alert("لا يوجد رقم");let t=`🏢 برج الرسالة\nالشقة: ${v.apartments.apartment_number}\nالمخالفة: ${v.violation_type}\nالقيمة: ${money(v.amount)}\nموعد التحصيل: ${date(v.due_date)}\nبرجاء التكرم بالسداد.`;open("https://wa.me/"+ph+"?text="+encodeURIComponent(t),"_blank")}
async function paymentsPage(){let r=await db.from("payments").select("*,apartments(apartment_number)").order("payment_date",{ascending:false});$("main").innerHTML=head("المدفوعات","سجل التحصيل",`<button class="primary" onclick="pModal()">+ دفعة</button>`)+(r.data||[]).map(x=>`<div class="card row"><span>شقة ${esc(x.apartments?.apartment_number)}<small>${date(x.payment_date)}</small></span><b>${money(x.amount)}</b></div>`).join("")||'<div class="empty">لا توجد مدفوعات</div>'}
function pModal(){openM("إضافة دفعة",`<input id="pa" placeholder="رقم الشقة"><input id="px" type="number" placeholder="المبلغ"><input id="pn" placeholder="ملاحظات"><div class="buttons"><button class="primary" onclick="saveP()">حفظ</button><button onclick="closeM()">إلغاء</button></div>`)}
async function saveP(){let a=(await db.from("apartments").select("*")).data||[],ap=a.find(x=>String(x.apartment_number)===$("pa").value.trim());if(!ap)return alert("الشقة غير موجودة");let r=await db.from("payments").insert({apartment_id:ap.id,amount:+$("px").value||0,notes:$("pn").value,created_by:session.user.id});if(r.error)alert(r.error.message);else{closeM();paymentsPage()}}
async function expensesPage(){let r=await db.from("expenses").select("*").order("expense_date",{ascending:false});$("main").innerHTML=head("المصروفات","مصروفات البرج",`<button class="primary" onclick="eModal()">+ مصروف</button>`)+(r.data||[]).map(x=>`<div class="card row"><span>${esc(x.title)}<small>${date(x.expense_date)}</small></span><b>${money(x.amount)}</b></div>`).join("")||'<div class="empty">لا توجد مصروفات</div>'}
function eModal(){openM("إضافة مصروف",`<input id="et" placeholder="البيان"><input id="ex" type="number" placeholder="القيمة"><textarea id="en" placeholder="ملاحظات"></textarea><div class="buttons"><button class="primary" onclick="saveE()">حفظ</button><button onclick="closeM()">إلغاء</button></div>`)}
async function saveE(){let r=await db.from("expenses").insert({title:$("et").value,amount:+$("ex").value||0,notes:$("en").value,created_by:session.user.id});if(r.error)alert(r.error.message);else{closeM();expensesPage()}}
async function usersPage(){let r=await db.from("profiles").select("*,apartments(apartment_number)").order("created_at",{ascending:false});$("main").innerHTML=head("المستخدمون","إدارة الأشخاص",`<button class="primary" onclick="userM()">+ مستخدم</button>`)+(r.data||[]).map(x=>`<div class="card user"><div class="avatar">👤</div><div><b>${esc(x.full_name||x.username)}</b><p>${esc(x.username)} • ${esc(x.role)}</p><small>${x.apartments?"شقة "+esc(x.apartments.apartment_number):"غير مربوط"} • ${x.is_active?"🟢":"🔴"}</small></div></div>`).join("")}
function userM(){openM("إضافة مستخدم",`<input id="un" placeholder="Username"><input id="uf" placeholder="الاسم الكامل"><input id="ut" type="password" placeholder="كلمة مرور مؤقتة"><input id="ua" placeholder="رقم الشقة (اختياري)"><select id="ur"><option value="resident">ساكن</option><option value="admin">Admin</option></select><div class="buttons"><button class="primary" onclick="createUser()">إنشاء</button><button onclick="closeM()">إلغاء</button></div>`)}
async function createUser(){let body={username:$("un").value.trim(),full_name:$("uf").value.trim(),password:$("ut").value,apartment_number:$("ua").value.trim()||null,role:$("ur").value};let r=await db.functions.invoke("create-user",{body});if(r.error)return alert(r.error.message);alert("تم إنشاء المستخدم");closeM();usersPage()}
function filesPage(){openM("رفع ملف",`<input id="ff" type="file" multiple accept="image/*,video/*,.pdf"><p class="muted">سيتم الرفع إلى Supabase Storage مع تسجيل البيانات.</p><div class="buttons"><button class="primary" onclick="upload()">رفع</button><button onclick="closeM()">إلغاء</button></div>`);$("main").innerHTML=head("المرفقات","فواتير وصور وفيديوهات",`<button class="primary" onclick="filesPage()">+ رفع ملف</button>`)+`<div class="card empty">اختر ملفًا لرفعه. صلاحيات العرض يجب أن تكون مرتبطة بالمستخدم/الشقة عبر RLS.</div>`}
async function upload(){let fs=[...$("ff").files];if(!fs.length)return;for(const f of fs){let path=`${session.user.id}/${Date.now()}-${f.name}`,r=await db.storage.from("building-files").upload(path,f);if(r.error)return alert(r.error.message);await db.from("attachments").insert({storage_path:path,file_name:f.name,mime_type:f.type,size_bytes:f.size,uploaded_by:session.user.id})}alert("تم الرفع");closeM();filesPage()}
async function auditPage(){let r=await db.from("audit_logs").select("*").order("created_at",{ascending:false}).limit(100);$("main").innerHTML=head("سجل العمليات","آخر العمليات")+(r.data||[]).map(x=>`<div class="card row"><span>${esc(x.action)}<small>${date(x.created_at)}</small></span></div>`).join("")||'<div class="empty">لا يوجد سجل</div>'}
async function myPage(){let a=(await db.from("apartments").select("*").eq("id",me.apartment_id).single()).data,v=(await db.from("violations").select("*").eq("apartment_id",me.apartment_id).order("created_at",{ascending:false})).data||[];$("main").innerHTML=head("شقتي","بياناتك")+`<div class="hero">🏠<b>شقة ${esc(a?.apartment_number)}</b><small>${esc(a?.resident_name)}</small><strong>${money(a?.monthly_fee)} / شهر</strong></div><div class="card"><h3>⚠️ المخالفات</h3>${v.map(x=>`<div class="row"><span>${esc(x.violation_type)}<small>موعد التحصيل: ${date(x.due_date)}</small></span><b>${money(x.amount)}</b></div>`).join("")||'<div class="empty">لا توجد مخالفات 🎉</div>'}</div>`}
async function logout(){await db.auth.signOut();location.reload()}
</script></body></html>
