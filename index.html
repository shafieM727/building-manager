rid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.head h2{font-size:21px}#nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;z-index:30;justify-content:space-around;padding:5px 2px calc(5px + env(safe-area-inset-bottom))}#nav button{background:transparent;display:flex;flex-direction:column;align-items:center;font-size:18px;padding:4px}#nav small{font-size:9px}.card{border-radius:15px}.table{font-size:13px}.wide{width:100%;margin:5px 0;text-align:right}.moremenu{display:flex;flex-direction:column;gap:4px}}

<div id="login" class="login"><div class="loginbox"><div class="logo">🏢</div><h1>برج الرسالة</h1><p class="muted">نظام إدارة البرج</p><input id="username" placeholder="Username مثل admin"><input id="password" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()"><button class="primary" onclick="login()">تسجيل الدخول</button><div id="loginerr" class="err"></div></div></div>
<div id="app" class="hidden"><header><div><b>🏢 برج الرسالة</b><small id="who"></small></div><button onclick="logout()">خروج</button></header><aside id="side"></aside><main id="main"></main><nav id="nav"></nav></div><div id="modal"></div>
<script>
const SUPABASE_URL="https://krnrgdsxecellehuezqg.supabase.co";
const SUPABASE_KEY="sb_publishable__Ctgcy0njM0Vy5fA3LcHrg_ooMv7o8u";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let me=null,session=null;
const $=id=>document.getElementById(id), esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])), money=x=>new Intl.NumberFormat("ar-EG",{style:"currency",currency:"EGP",maximumFractionDigits:0}).format(+x||0), date=x=>x?new Date(x).toLocaleDateString("ar-EG"):"-", today=()=>new Date().toISOString().slice(0,10), monthNow=()=>new Date().toISOString().slice(0,7);
function emailFor(u){u=u.trim().toLowerCase();return u.includes("@")?u:u+"@building.local"}
async function login(){let u=$("username").value,p=$("password").value;if(!u||!p)return $("loginerr").textContent="أدخل اسم المستخدم وكلمة المرور";let r=await db.auth.signInWithPassword({email:emailFor(u),password:p});if(r.error)return $("loginerr").textContent="اسم المستخدم أو كلمة المرور غير صحيحة";session=r.data.session;let q=await db.from("profiles").select("*").eq("id",session.user.id).single();if(q.error||!q.data?.is_active){await db.auth.signOut();return $("loginerr").textContent="الحساب غير مفعّل أو لا يوجد Profile مربوط به"}me=q.data;$("login").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=(me.full_name||me.username)+" • "+me.role;buildNav();me.must_change_password?passwordPage():me.role==="admin"?dashboardPage():myPage()}
function buildNav(){let a=me.role==="admin",items=a?[["dashboard","الرئيسية","🏠"],["apartments","الشقق","🏢"],["charges","الاشتراكات","📅"],["violations","المخالفات","⚠️"],["payments","المدفوعات","💳"],["expenses","المصروفات","🧾"],["users","المستخدمون","👥"],["files","المرفقات","📎"],["notifications","التنبيهات","🔔"],["audit","السجل","🕘"]]:[["my","شقتي","🏠"],["myCharges","الاشتراكات","📅"],["myViolations","المخالفات","⚠️"],["myPayments","المدفوعات","💳"],["myFiles","المرفقات","📎"]];$("side").innerHTML=items.map(x=>`<button onclick="${x[0]}Page()">${x[2]} ${x[1]}</button>`).join("");let mainItems=items.slice(0,4),more=items.slice(4);$("nav").innerHTML=mainItems.map(x=>`<button onclick="${x[0]}Page()">${x[2]}<small>${x[1]}</small></button>`).join("")+`<button onclick="moreMenu()">☰<small>المزيد</small></button>`;window.__moreItems=more}
function moreMenu(){let items=window.__moreItems||[];openModal("القائمة",`<div class="moremenu">${items.map(x=>`<button class="wide" onclick="closeModal();${x[0]}Page()">${x[2]} ${x[1]}</button>`).join("")}</div>`)}
function passwordPage(){$("main").innerHTML=`<div class="card" style="max-width:520px;margin:40px auto;text-align:center"><h2>🔐 تغيير كلمة المرور</h2><p class="muted">يجب تغيير كلمة المرور عند أول دخول.</p><input id="np1" type="password" placeholder="كلمة المرور الجديدة"><input id="np2" type="password" placeholder="تأكيد كلمة المرور"><button class="primary" onclick="savePassword()">حفظ واستمرار</button><div id="pmsg" class="err"></div></div>`}
async function savePassword(){let a=$("np1").value,b=$("np2").value;if(a.length<8)return $("pmsg").textContent="استخدم 8 أحرف على الأقل";if(a!==b)return $("pmsg").textContent="كلمتا المرور غير متطابقتين";let r=await db.auth.updateUser({password:a});if(r.error)return $("pmsg").textContent=r.error.message;await db.from("profiles").update({must_change_password:false}).eq("id",session.user.id);me.must_change_password=false;me.role==="admin"?dashboardPage():myPage()}
function head(t,s,b=""){return `<div class="head"><div><h2>${t}</h2><div class="muted">${s||""}</div></div>${b}</div>`}
async function dashboardPage(){let [a,c,v,p,e,n]=await Promise.all([db.from("apartments").select("*"),db.from("monthly_charges").select("*"),db.from("violations").select("*"),db.from("payments").select("*"),db.from("expenses").select("*"),db.from("notification_log").select("*").eq("status","queued")]);let sum=x=>(x||[]).reduce((s,z)=>s+(+z.amount||0),0),openV=(v.data||[]).filter(x=>!['paid','cancelled'].includes(x.status)),openC=(c.data||[]).filter(x=>!['paid','cancelled'].includes(x.status));$("main").innerHTML=head("لوحة التحكم","ملخص برج الرسالة",`<div class="actions"><button class="primary" onclick="generateMonth()">📅 إنشاء استحقاق الشهر</button><button onclick="notificationsPage()">🔔 ${n.data?.length||0} تنبيه معلق</button></div>`)+`<div class="stats"><div class="stat">🏢<b>${a.data?.length||0}</b><small>الشقق</small></div><div class="stat">💰<b>${money(sum(p.data))}</b><small>إجمالي المدفوعات</small></div><div class="stat">📅<b>${money(sum(openC))}</b><small>اشتراكات مستحقة</small></div><div class="stat">⚠️<b>${money(sum(openV))}</b><small>مخالفات مستحقة</small></div><div class="stat">🧾<b>${money(sum(e.data))}</b><small>المصروفات</small></div><div class="stat">💵<b>${money(sum(p.data)-sum(e.data))}</b><small>صافي التدفق</small></div></div><div class="grid"><div class="card"><h3>المخالفات التي تحتاج متابعة</h3>${openV.slice(0,8).map(x=>`<div class="row"><span>${esc(x.violation_type)}<small>التحصيل: ${date(x.due_date)}</small></span><b>${money(x.amount)}</b></div>`).join("")||'<div class="empty">لا توجد مخالفات مستحقة 🎉</div>'}</div><div class="card"><h3>استحقاقات الشهر</h3>${openC.slice(0,8).map(x=>`<div class="row"><span>شقة ${esc(x.apartment_id)}<small>${esc(x.period_month)}</small></span><b>${money((+x.amount||0)-(+x.paid_amount||0))}</b></div>`).join("")||'<div class="empty">لا توجد استحقاقات</div>'}</div></div>`}
async function apartmentsPage(){let r=await db.from("apartments").select("*").order("apartment_number"),a=r.data||[];$('main').innerHTML=head("الشقق",`${a.length} شقة`,`<button class="primary" onclick="aptModal()">+ إضافة شقة</button>`)+`<input class="search" id="aq" oninput="filterApt()" placeholder="🔎 رقم الشقة أو اسم الساكن"><div id="aptlist">${a.map(x=>`<div class="card apt click" data-q="${esc((x.apartment_number+" "+(x.resident_name||"")).toLowerCase())}" onclick="apartmentDetails('${x.id}')"><div class="between"><b>شقة ${esc(x.apartment_number)}</b><span class="badge">${money(x.monthly_fee)} / شهر</span></div><p>${esc(x.resident_name||"لا يوجد ساكن")}</p><div class="between"><small>${esc(x.phone||"لا يوجد رقم")}</small>${x.phone?`<button onclick="event.stopPropagation();openApartmentWA('${x.id}')">💬 WhatsApp</button>`:""}</div></div>`).join("")||'<div class="empty">لا توجد شقق</div>'}</div>`}
async function openApartmentWA(id){let q=await db.from("apartments").select("*").eq("id",id).single();let a=q.data;if(!a?.phone)return alert("لا يوجد رقم WhatsApp للشقة");let t=`🏢 برج الرسالة\nالشقة: ${a.apartment_number}\nالساكن: ${a.resident_name||""}\nبرجاء التواصل مع إدارة البرج.`;window.open("https://wa.me/"+a.phone.replace(/\D/g,"")+"?text="+encodeURIComponent(t),"_blank")}
function filterApt(){let q=$("aq").value.toLowerCase();document.querySelectorAll(".apt").forEach(x=>x.style.display=x.dataset.q.includes(q)?"block":"none")}
function openModal(t,body){$("modal").innerHTML=`<div class="modalwrap" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>${t}</h3>${body}</div></div>`}function closeModal(){$("modal").innerHTML=""}
function aptModal(x={}){openModal(x.id?"تعديل شقة":"إضافة شقة",`<input id="an" value="${esc(x.apartment_number||"")}" placeholder="رقم الشقة"><input id="rn" value="${esc(x.resident_name||"")}" placeholder="اسم الساكن"><input id="ph" value="${esc(x.phone||"")}" placeholder="رقم WhatsApp بصيغة دولية"><input id="mf" type="number" value="${x.monthly_fee||0}" placeholder="الاشتراك الشهري"><div class="buttons"><button class="primary" onclick="saveApt('${x.id||""}')">حفظ</button><button onclick="closeModal()">إلغاء</button></div>`)}
async function saveApt(id){let payload={apartment_number:$("an").value.trim(),resident_name:$("rn").value.trim(),phone:$("ph").value.trim(),monthly_fee:+$("mf").value||0};let r=id?await db.from("apartments").update(payload).eq("id",id):await db.from("apartments").insert(payload);if(r.error)return alert(r.error.message);closeModal();apartmentsPage()}
async function apartmentDetails(id){let [a,u,c,v,p,f]=await Promise.all([db.from("apartments").select("*").eq("id",id).single(),db.from("profiles").select("*").eq("apartment_id",id),db.from("monthly_charges").select("*").eq("apartment_id",id).order("period_month",{ascending:false}),db.from("violations").select("*").eq("apartment_id",id).order("created_at",{ascending:false}),db.from("payments").select("*").eq("apartment_id",id).order("payment_date",{ascending:false}),db.from("attachments").select("*").eq("apartment_id",id).order("created_at",{ascending:false})]);let x=a.data;$("main").innerHTML=head(`شقة ${esc(x?.apartment_number)}`,"تفاصيل الحساب",`<div class="actions"><button class="primary" onclick='aptModal(${JSON.stringify(x).replace(/'/g,"&#39;")})'>✏️ تعديل</button><button onclick="vModal('${id}')">⚠️ مخالفة</button><button onclick="chargeModal('${id}')">📅 استحقاق</button></div>`)+`<div class="hero"><b>${esc(x?.resident_name||"بدون ساكن")}</b><span>${esc(x?.phone||"لا يوجد رقم")}</span><strong>${money(x?.monthly_fee)} / شهر</strong></div><div class="grid"><div class="card"><h3>👤 المستخدم</h3>${(u.data||[]).map(z=>`<div class="row"><span>${esc(z.full_name||z.username)}<small>${esc(z.role)}</small></span><span class="pill">${z.is_active?'مفعل':'معطل'}</span></div>`).join("")||'<div class="empty">لا يوجد مستخدم مرتبط</div>'}</div><div class="card"><h3>💳 المدفوعات</h3>${(p.data||[]).slice(0,6).map(z=>`<div class="row"><span>${date(z.payment_date)}<small>${esc(z.notes||"")}</small></span><b>${money(z.amount)}</b></div>`).join("")||'<div class="empty">لا يوجد</div>'}</div></div><div class="card"><h3>📅 الاشتراكات</h3>${(c.data||[]).slice(0,12).map(z=>chargeRow(z)).join("")||'<div class="empty">لا توجد استحقاقات</div>'}</div><div class="card"><h3>⚠️ المخالفات</h3>${(v.data||[]).slice(0,12).map(z=>violationRow(z)).join("")||'<div class="empty">لا توجد مخالفات</div>'}</div><div class="card"><h3>📎 المرفقات</h3>${(f.data||[]).map(z=>fileRow(z)).join("")||'<div class="empty">لا توجد مرفقات</div>'}</div>`}
function chargeRow(z){let rem=(+z.amount||0)-(+z.paid_amount||0);return `<div class="row"><span>${esc(z.period_month)}<small>استحقاق ${date(z.due_date)} • ${esc(z.status)}</small></span><span><b>${money(rem)}</b> <button onclick="pModal('${z.apartment_id}','${z.id}')">دفع</button></span></div>`}
function violationRow(v){return `<div class="row"><span>${esc(v.violation_type)}<small>استحقاق ${date(v.due_date)} • ${esc(v.status||'unpaid')}</small></span><span><b>${money(v.amount)}</b> <button onclick="sendWA('${v.id}')">💬</button> <button onclick="markPaid('${v.id}')">✓</button></span></div>`}
function fileRow(f){return `<div class="file"><span>📎 ${esc(f.file_name)}<small>${date(f.created_at)}</small></span><button onclick="downloadFile('${f.storage_path}')">فتح</button></div>`}
async function chargesPage(){let r=await db.from("monthly_charges").select("*,apartments(apartment_number,resident_name)").order("period_month",{ascending:false}).limit(200),a=r.data||[];$('main').innerHTML=head("الاشتراكات","الاستحقاقات الشهرية والتحصيل",`<div class="actions"><button class="primary" onclick="generateMonth()">📅 إنشاء شهر</button><button onclick="chargeModal()">+ استحقاق يدوي</button></div>`)+`<input class="search" id="cq" oninput="filterCards('cq','.charge')" placeholder="🔎 شقة أو شهر أو حالة"><div id="charges">${a.map(x=>`<div class="card charge" data-q="${esc((x.apartments?.apartment_number+' '+x.period_month+' '+x.status).toLowerCase())}"><div class="between"><div><b>شقة ${esc(x.apartments?.apartment_number)}</b><p>${esc(x.period_month)}</p></div><strong>${money(x.amount)}</strong></div><small>استحقاق ${date(x.due_date)} • مدفوع ${money(x.paid_amount)} • متبقي ${money((+x.amount||0)-(+x.paid_amount||0))}</small><div class="actions"><button onclick="pModal('${x.apartment_id}','${x.id}')">💳 تسجيل دفع</button><button onclick="editCharge('${x.id}')">✏️</button></div></div>`).join("")||'<div class="empty">لا توجد استحقاقات</div>'}</div>`}
function filterCards(input,cls){let q=$(input).value.toLowerCase();document.querySelectorAll(cls).forEach(x=>x.style.display=x.dataset.q.includes(q)?'block':'none')}
async function generateMonth(){let m=monthNow(),r=await db.from("apartments").select("id,monthly_fee");if(r.error)return alert(r.error.message);let rows=(r.data||[]).filter(x=>+x.monthly_fee>0).map(x=>({apartment_id:x.id,period_month:m,due_date:m+'-01',amount:+x.monthly_fee,paid_amount:0,status:'unpaid',created_by:session.user.id}));if(!rows.length)return alert('لا توجد شقق باشتراك شهري');let ins=await db.from('monthly_charges').upsert(rows,{onConflict:'apartment_id,period_month',ignoreDuplicates:true});if(ins.error)return alert(ins.error.message);alert('تم إنشاء استحقاق '+m+' للشقق');chargesPage()}
function chargeModal(apartmentId=null){openModal("استحقاق اشتراك",`<label class="label">الشقة</label><input id="ca" value="${apartmentId||''}" placeholder="Apartment ID أو رقم الشقة"><label class="label">الشهر YYYY-MM</label><input id="cm" value="${monthNow()}"><input id="cd" type="date" value="${today()}"><input id="cv" type="number" placeholder="القيمة"><div class="buttons"><button class="primary" onclick="saveCharge()">حفظ</button><button onclick="closeModal()">إلغاء</button></div>`)}
async function saveCharge(){let v=$("ca").value.trim(),ap=(await db.from('apartments').select('*')).data?.find(x=>String(x.id)===v||String(x.apartment_number)===v);if(!ap)return alert('الشقة غير موجودة');let r=await db.from('monthly_charges').upsert({apartment_id:ap.id,period_month:$("cm").value,due_date:$("cd").value,amount:+$("cv").value||+ap.monthly_fee||0,paid_amount:0,status:'unpaid',created_by:session.user.id},{onConflict:'apartment_id,period_month'});if(r.error)return alert(r.error.message);closeModal();chargesPage()}
async function editCharge(id){let z=(await db.from('monthly_charges').select('*').eq('id',id).single()).data;if(!z)return;openModal('تعديل الاستحقاق',`<input id="ev" type="number" value="${z.amount}"><input id="ed" type="date" value="${z.due_date||''}"><select id="es"><option ${z.status==='unpaid'?'selected':''} value="unpaid">مستحق</option><option ${z.status==='partial'?'selected':''} value="partial">جزئي</option><option ${z.status==='paid'?'selected':''} value="paid">مدفوع</option><option ${z.status==='cancelled'?'selected':''} value="cancelled">ملغي</option></select><div class="buttons"><button class="primary" onclick="updateCharge('${id}')">حفظ</button></div>`)}

async function violationsPage(){let r=await db.from("violations").select("*,apartments(apartment_number,phone)").order("created_at",{ascending:false}),a=r.data||[];$('main').innerHTML=head("المخالفات","القيمة وموعد التحصيل",`<button class="primary" onclick="vModal()">+ مخالفة</button>`)+a.map(v=>`<div class="card"><div class="between"><div><b>شقة ${esc(v.apartments?.apartment_number)}</b><p>${esc(v.violation_type)}</p></div><strong>${money(v.amount)}</strong></div><small>📅 موعد التحصيل: ${date(v.due_date)} • ${esc(v.status||"unpaid")}</small><div class="actions"><button onclick="sendWA('${v.id}')">💬 WhatsApp</button><button onclick="editViolation('${v.id}')">✏️</button><button onclick="markPaid('${v.id}')">✓ تم السداد</button></div></div>`).join("")||'<div class="empty">لا توجد مخالفات</div>'}
function vModal(apartmentId=null){openModal("إضافة مخالفة",`<input id="va" placeholder="رقم الشقة أو Apartment ID" value="${apartmentId||''}"><input id="vt" placeholder="نوع المخالفة"><input id="vm" type="number" placeholder="قيمة المخالفة"><label class="label">تاريخ المخالفة</label><input id="vx" type="date" value="${today()}"><label class="label">موعد التحصيل</label><input id="vd" type="date"><textarea id="vn" placeholder="ملاحظات / تفاصيل"></textarea><div class="buttons"><button class="primary" onclick="saveV()">حفظ</button><button onclick="closeModal()">إلغاء</button></div>`)}

async function saveV(){let ap=await findApt($("va").value.trim());if(!ap)return alert("الشقة غير موجودة");let r=await db.from("violations").insert({apartment_id:ap.id,violation_type:$("vt").value.trim(),amount:+$("vm").value||0,due_date:$("vd").value||null,status:"unpaid",created_by:session.user.id,notes:$("vn").value,violation_date:$("vx").value||today()});if(r.error)return alert(r.error.message);closeModal();violationsPage()}
async function editViolation(id){let z=(await db.from('violations').select('*').eq('id',id).single()).data;if(!z)return;openModal('تعديل مخالفة',`<input id="vt" value="${esc(z.violation_type)}"><input id="vm" type="number" value="${z.amount}"><input id="vd" type="date" value="${z.due_date||''}"><select id="vs"><option value="unpaid" ${z.status==='unpaid'?'selected':''}>غير مدفوعة</option><option value="paid" ${z.status==='paid'?'selected':''}>مدفوعة</option><option value="cancelled" ${z.status==='cancelled'?'selected':''}>ملغاة</option></select><textarea id="vn">${esc(z.notes||'')}</textarea><div class="buttons"><button class="primary" onclick="updateViolation('${id}')">حفظ</button></div>`)}
async function updateViolation(id){let r=await db.from('violations').update({violation_type:$("vt").value,amount:+$("vm").value||0,due_date:$("vd").value||null,status:$("vs").value,notes:$("vn").value}).eq('id',id);if(r.error)return alert(r.error.message);closeModal();violationsPage()}
async function markPaid(id){let r=await db.from("violations").update({status:"paid"}).eq("id",id);if(r.error)alert(r.error.message);else violationsPage()}
function normalizeWhatsAppPhone(raw){
  let p=String(raw||"").trim().replace(/[\s().-]/g,"");
  if(!p) return null;
  if(p.startsWith("00")) p=p.slice(2);
  if(p.startsWith("+")) p=p.slice(1);
  // Egypt local mobile: 01012345678 -> 201012345678
  if(p.startsWith("01") && p.length===11) p="20"+p;
  return /^\d{8,15}$/.test(p) ? p : null;
}
function whatsappUrl(phone,text){
  const normalized=normalizeWhatsAppPhone(phone);
  return normalized ? "https://wa.me/"+normalized+"?text="+encodeURIComponent(text) : null;
}
async function sendWA(id){
  let q=await db.from("violations").select("*,apartments(*)").eq("id",id).single(),v=q.data;
  if(q.error||!v) return alert("تعذر تحميل بيانات المخالفة");
  let phone=normalizeWhatsAppPhone(v.apartments?.phone);
  if(!phone) return alert("رقم WhatsApp غير صحيح. استخدم مثل 01012345678 أو +201012345678");
  let t=`🏢 برج الرسالة\nالشقة: ${v.apartments.apartment_number}\nالمخالفة: ${v.violation_type}\nالقيمة: ${money(v.amount)}\nموعد التحصيل: ${date(v.due_date)}\nبرجاء التكرم بالسداد.`;
  window.open(whatsappUrl(phone,t),"_blank");
}\nالمخالفة: ${v.violation_type}\nالقيمة: ${money(v.amount)}\nموعد التحصيل: ${date(v.due_date)}\nبرجاء التكرم بالسداد.`;window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(t),"_blank")}

async function saveP(){let ap=await findApt($("pa").value.trim());if(!ap)return alert("الشقة غير موجودة");let amount=+$("pm").value||0;if(amount<=0)return alert('أدخل مبلغًا صحيحًا');let r=await db.from("payments").insert({apartment_id:ap.id,amount,notes:$("pn").value,created_by:session.user.id,payment_date:new Date().toISOString()});if(r.error)return alert(r.error.message);let chargeId=$("pc").value.trim();if(chargeId){let c=(await db.from('monthly_charges').select('*').eq('id',chargeId).single()).data;if(c){let paid=Math.min(+c.amount,+c.paid_amount+amount),status=paid>=+c.amount?'paid':paid>0?'partial':'unpaid';await db.from('monthly_charges').update({paid_amount:paid,status}).eq('id',chargeId)}}closeModal();paymentsPage()}

async function uploadFiles(){let files=[...$("fi").files],ap=await findApt($("fa").value.trim()),vid=$("fv").value.trim()||null;if(!files.length)return alert('اختر ملفًا');for(let f of files){let path=`${ap?.id||'general'}/${Date.now()}-${Math.random().toString(36).slice(2)}-${f.name}`;let r=await db.storage.from('building-files').upload(path,f);if(r.error)return alert(r.error.message);let m=await db.from('attachments').insert({apartment_id:ap?.id||null,violation_id:vid,storage_path:path,file_name:f.name,mime_type:f.type,size_bytes:f.size,uploaded_by:session.user.id});if(m.error)return alert(m.error.message)}alert('تم رفع الملفات');closeModal();filesPage()}

async function myPage(){let a=(await db.from("apartments").select("*").eq("id",me.apartment_id).single()).data,v=(await db.from("violations").select("*").eq("apartment_id",me.apartment_id).order("created_at",{ascending:false})).data||[],c=(await db.from('monthly_charges').select('*').eq('apartment_id',me.apartment_id).order('period_month',{ascending:false}).limit(12)).data||[],p=(await db.from('payments').select('*').eq('apartment_id',me.apartment_id).order('payment_date',{ascending:false}).limit(12)).data||[],f=(await db.from('attachments').select('*').eq('apartment_id',me.apartment_id).order('created_at',{ascending:false})).data||[];$('main').innerHTML=head('شقتي','ملخص حسابك')+`<div class="hero">🏠<b>شقة ${esc(a?.apartment_number)}</b><small>${esc(a?.resident_name)}</small><strong>${money(a?.monthly_fee)} / شهر</strong></div><div class="grid"><div class="card"><h3>📅 الاشتراكات</h3>${c.map(chargeRow).join('')||'<div class="empty">لا توجد</div>'}</div><div class="card"><h3>💳 المدفوعات</h3>${p.map(x=>`<div class="row"><span>${date(x.payment_date)}<small>${esc(x.notes||'')}</small></span><b>${money(x.amount)}</b></div>`).join('')||'<div class="empty">لا توجد</div>'}</div></div><div class="card"><h3>⚠️ المخالفات</h3>${v.map(violationRow).join('')||'<div class="empty">لا توجد مخالفات 🎉</div>'}</div><div class="card"><h3>📎 المرفقات</h3>${f.map(fileRow).join('')||'<div class="empty">لا توجد مرفقات</div>'}</div>`}
